# Сборка macOS-версии. Windows-версия живёт в ветке windows со своим
# workflow и тегами v*; здесь — только main и теги mac-v*, чтобы две
# сборки не задевали друг друга.
name: macOS

on:
  push:
    branches: [main]
    tags: ["mac-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Тот же sing-box, что в README, шаг 2: приложение везёт его внутри.
  SINGBOX_VERSION: 1.14.1-lx.12

jobs:
  build:
    runs-on: macos-14          # arm64, как и сборка sing-box
    permissions:
      contents: write          # выкладка релиза по тегу
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Номер берётся только из VERSION. Тег с другим номером — ошибка выпуска,
      # а не повод собрать «что-то»: в окне и в релизе версии разъехались бы.
      - name: Тег совпадает с VERSION
        if: startsWith(github.ref, 'refs/tags/mac-v')
        run: |
          WANT="mac-v$(cat VERSION)"
          [ "$GITHUB_REF_NAME" = "$WANT" ] || {
            echo "тег $GITHUB_REF_NAME, а в VERSION — $WANT"; exit 1; }

      - name: sing-box
        run: |
          ARCH=darwin-arm64
          NAME=sing-box-$SINGBOX_VERSION-$ARCH
          mkdir -p lib/bin
          curl -fsSL -o "$RUNNER_TEMP/sb.tar.gz" \
            "https://github.com/Leadaxe/sing-box-lx/releases/download/v$SINGBOX_VERSION/$NAME.tar.gz"
          tar xzf "$RUNNER_TEMP/sb.tar.gz" -C lib/bin --strip-components=1 "$NAME/sing-box"
          chmod +x lib/bin/sing-box
          lib/bin/sing-box version | head -1

      - name: Зависимости
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q rumps py2app pyobjc-framework-WebKit
          echo "PY=$(command -v python)" >> "$GITHUB_ENV"

      - name: Тесты
        run: |
          "$PY" -m unittest discover -s tests
          node --test tests/test_view.js

      - name: Образ
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/mac-v')
        run: |
          "$PY" lib/scripts/make-icons.py >/dev/null
          bash lib/scripts/make-dmg.sh
          echo "VER=$(cat VERSION)" >> "$GITHUB_ENV"

      # Описание релиза — раздел версии из CHANGELOG.md.
      - name: Что нового
        if: startsWith(github.ref, 'refs/tags/mac-v')
        run: bash lib/scripts/changelog.sh "$VER" > "$RUNNER_TEMP/notes.md"

      - name: Артефакт
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: DualVPN-${{ env.VER }}
          path: |
            dist/DualVPN-${{ env.VER }}.dmg
            dist/DualVPN-${{ env.VER }}.dmg.sha256

      # «Latest» в репозитории один на обе ОС и достаётся последнему вышедшему
      # релизу. Поэтому приложение ищет свои релизы по префиксу тега, а не по
      # releases/latest: там может оказаться Windows.
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/mac-v')
        uses: softprops/action-gh-release@v2
        with:
          name: DualVPN macOS ${{ env.VER }}
          body_path: ${{ runner.temp }}/notes.md
          files: |
            dist/DualVPN-${{ env.VER }}.dmg
            dist/DualVPN-${{ env.VER }}.dmg.sha256
