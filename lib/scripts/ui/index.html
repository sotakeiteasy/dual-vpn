<!doctype html>
<meta charset="utf-8">
<title>DualVPN</title>
<style>
:root {
  color-scheme: light dark;
  --bg:        #ececec;
  --panel:     #fbfbfb;
  --line:      #00000014;
  --text:      #1d1d1f;
  --dim:       #6e6e73;
  --ok:        #1a9c4b;
  --warn:      #c77700;
  --bad:       #d13b30;
  --off:       #8e8e93;
  --accent:    #0a6cff;
  --logbg:     #ffffff;
}
/* Тема: data-theme на <html> — выбор из кнопки в строке вкладок (system |
   light | dark). Тёмные цвета дважды: при тёмной системе, если не выбрана
   светлая, и при явно выбранной тёмной — media-запрос в список селекторов
   не сложить. color-scheme меняется вместе: от него зависят полосы
   прокрутки и галочки. */
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"]  { color-scheme: dark; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:    #1c1c1e;  --panel: #252527;  --line: #ffffff1a;
    --text:  #f2f2f7;  --dim:   #98989f;  --logbg: #1a1a1c;
    --ok: #32d367; --warn: #ffb03a; --bad: #ff5f52; --off: #7c7c82;
    --accent: #4c9bff;
  }
}
:root[data-theme="dark"] {
  --bg:    #1c1c1e;  --panel: #252527;  --line: #ffffff1a;
  --text:  #f2f2f7;  --dim:   #98989f;  --logbg: #1a1a1c;
  --ok: #32d367; --warn: #ffb03a; --bad: #ff5f52; --off: #7c7c82;
  --accent: #4c9bff;
}
* { box-sizing: border-box; }
/* Без !important атрибут hidden проигрывает display:flex у самого элемента —
   поиск по логу оставался виден во вкладке «как это работает». */
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  color: var(--text); background: var(--bg);
  display: grid; grid-template-columns: 330px 1fr; height: 100vh;
  overflow: hidden;                    /* прокручивается содержимое, не окно */
  -webkit-user-select: none; user-select: none;
}
/* min-height:0 обязателен: без него flex-потомок не сжимается ниже своего
   содержимого, прокрутка уезжает на всё окно и обе панели едут вместе. */
#side, #logs, #lines, #how { min-height: 0; }

/* ------------------------------------------------------------ левая часть */
#side { display: flex; flex-direction: column; gap: 12px; padding: 14px; overflow-y: auto; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }

/* Главное состояние: крупно, одной фразой, чтобы читалось с расстояния. */
#state { padding: 13px 14px; display: flex; gap: 11px; align-items: flex-start; }
/* Разделитель вместо зазора: состояние и туннели — про одно и то же,
   отдельными карточками они читались как два несвязанных блока. */
#tunnels { border-top: 1px solid var(--line); }
#dot { width: 11px; height: 11px; border-radius: 50%; margin-top: 4px; flex: none;
       background: var(--off); box-shadow: 0 0 0 3px transparent; }
#dot.ok   { background: var(--ok);   box-shadow: 0 0 0 3px #1a9c4b22; }
#dot.warn { background: var(--warn); box-shadow: 0 0 0 3px #c7770022; }
#dot.bad  { background: var(--bad);  box-shadow: 0 0 0 3px #d13b3022; }
#state-title { font-size: 15px; font-weight: 600; letter-spacing: -0.1px; }
#state-sub   { color: var(--dim); margin-top: 2px; }

/* Туннели: «● имя адрес … задержка». Слово состояния — в подсказке точки:
   плашка со словом занимала полстроки и выталкивала адрес. Точка — первой,
   у края: между именем и адресом она терялась посреди строки. */
.tun { display: flex; align-items: center; gap: 8px; padding: 9px 14px; }
.tun + .tun { border-top: 1px solid var(--line); }
/* Строка туннеля — переключатель: клик выключает его или включает обратно. */
.tun.toggle { cursor: pointer; }
.tun.toggle:hover { background: #80808014; }
.tun.off .tun-val { color: var(--dim); }
.tun-name { width: 50px; color: var(--dim); flex: none; }
.tdot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--off); }
.tdot.ok  { background: var(--ok); }
.tdot.bad { background: var(--bad); }
.tun-val  { font-variant-numeric: tabular-nums; min-width: 0;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tun-ms   { margin-left: auto; flex: none; color: var(--dim); font-size: 12px;
            font-variant-numeric: tabular-nums; transition: color 0.6s; }
/* Свежий ручной замер: цифры часто те же, и без вспышки не видно, что он был. */
.tun-ms.fresh { color: var(--ok); transition: none; }
/* Идёт замер: три точки по очереди, как у набора сообщения. */
.tun-ms.measuring { display: flex; gap: 3px; align-items: center; height: 14px; }
.tun-ms.measuring i { width: 4px; height: 4px; border-radius: 50%; background: var(--dim);
                      animation: blink 1s infinite ease-in-out both; }
.tun-ms.measuring i:nth-child(2) { animation-delay: 0.15s; }
.tun-ms.measuring i:nth-child(3) { animation-delay: 0.3s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

#actions { display: flex; gap: 7px; }
/* Иконки без подписи: смысл — в title и aria-label. Высота тянется по
   соседней кнопке, чтобы ряд был ровным. */
button.icon { flex: none; width: 34px; padding: 0;
              display: inline-flex; align-items: center; justify-content: center; }
button.icon.probing { opacity: 1; }
button.icon.probing svg { display: none; }
button.icon.probing::after { content: ''; width: 13px; height: 13px; border-radius: 50%;
                             border: 2px solid #80808040; border-top-color: currentColor;
                             animation: spin 0.8s linear infinite; }
/* flex:1 у button задумано для строк кнопок; прямой потомок колонки от него
   растягивался на всю свободную высоту. Отрицательный отступ подтягивает
   кнопку к карточке над ней: общий gap колонки в 12px здесь слишком велик. */
#side > button { flex: none; margin-top: -5px; }
#confs-wrap { display: flex; flex-direction: column; gap: 12px; }
button {
  font: inherit; font-weight: 500; color: var(--text); flex: 1;
  padding: 7px 10px; border-radius: 7px; border: 1px solid var(--line);
  background: var(--panel); cursor: pointer;
}
/* :not(.primary) обязателен: иначе это правило перебивает синий фон по
   специфичности, и на наведении кнопка становилась почти белой. */
button:hover:not(:disabled):not(.primary) { background: #8080801a; }
button:disabled { opacity: 0.45; cursor: default; }
button.busy { color: var(--dim); }
button.primary { background: var(--accent); border-color: transparent; color: #fff; }
button.primary:hover:not(:disabled) { background: #0b62e4; }

/* При поднятом туннеле конфиги не трогаются: смена файла всё равно
   подействует только после перезапуска, а полупроходной режим («поменял,
   а работает старое») уже один раз всех запутал. Гасим весь блок целиком —
   так понятнее, чем поштучно выключенные кнопки. */
#confs-wrap.locked { opacity: 0.45; pointer-events: none; }
#lockhint { color: var(--dim); padding: 2px 3px 0; }
/* Подвал колонки: версия нужна, когда просят «а какая у тебя», но внимания
   к себе требовать не должна. */
#version { color: var(--dim); font-size: 11px; padding: 2px 3px 4px;
           margin-top: auto; }
/* Новая версия — единственное в подвале, что просит внимания. */
#upd { color: var(--text); margin-top: 2px; }
#upd.bad { color: var(--bad); }
#upd a { color: var(--accent); text-decoration: none; }
h2 { font-size: 11px; font-weight: 600; text-transform: uppercase;
     letter-spacing: 0.5px; color: var(--dim); margin: 4px 0 -2px 3px;
     display: flex; align-items: center; gap: 5px; }
/* Значок рисуется SVG, а не буквой: «i» в кружке уезжала от центра —
   letter-spacing заголовка и пустое место над точкой в метриках шрифта. */
.info { width: 14px; height: 14px; flex: none; cursor: pointer; color: var(--dim);
        display: inline-flex; }
.info svg { pointer-events: none; }
.info:hover { color: var(--accent); }
/* Действия раздела — значками в его заголовке. Полноширинные кнопки под
   каждым списком вытягивали колонку выше окна, и она прокручивалась. */
.hacts { margin-left: auto; display: flex; gap: 2px; }
h2 button.icon { width: 22px; height: 20px; border: none; background: none;
                 color: var(--dim); border-radius: 5px; }
h2 button.icon:hover:not(:disabled) { color: var(--text); }
.warnline { color: var(--warn); padding: 8px 12px; }

/* Конфиги: список с пометкой активного и кнопкой добавления. */
.conf { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; }
.conf + .conf { border-top: 1px solid var(--line); }
.conf:hover { background: #8080801a; }
/* Точка — градиентом от центра, а не заливкой с inset-тенью: дробная тень
   внутри нечётного кружка округлялась в пиксели и уезжала от центра. */
.conf-radio { width: 14px; height: 14px; box-sizing: border-box; border-radius: 50%;
              flex: none; border: 1.5px solid var(--dim); }
.conf.active .conf-radio { border-color: var(--accent);
  background: radial-gradient(circle closest-side, var(--accent) 55%, transparent 60%); }
.conf[data-kind="corp"] { cursor: default; }
.conf[data-kind="corp"]:hover { background: none; }
.conf-name { flex: 1; }
.conf-kind { font-size: 11px; color: var(--dim); }
.conf-menu { flex: none; width: 24px; padding: 0; line-height: 18px; color: var(--dim);
             background: none; border: none; border-radius: 5px; font-size: 15px; }
.conf-menu:hover { background: #80808033; color: var(--text); }
.emptyrow { padding: 11px 12px; color: var(--dim); }

#rowmenu { position: fixed; z-index: 20; background: var(--panel); padding: 4px;
           border: 1px solid var(--line); border-radius: 8px; min-width: 132px;
           box-shadow: 0 8px 24px #00000033; display: flex; flex-direction: column; }
#rowmenu button { text-align: left; border: none; background: none; padding: 5px 9px;
                  border-radius: 5px; font-weight: 400; }
#rowmenu button:hover { background: #80808026; }
#rowmenu button.danger { color: var(--bad); }

/* ------------------------------------------------------------ правая часть */
#logs { display: flex; flex-direction: column; border-left: 1px solid var(--line);
        background: var(--logbg); min-width: 0; overflow: hidden; }
#logbar { display: flex; gap: 8px; align-items: center; padding: 9px 12px;
          border-bottom: 1px solid var(--line); }
#search { flex: 1; font: inherit; padding: 4px 9px; border-radius: 6px;
          border: 1px solid var(--line); background: var(--bg); color: var(--text);
          -webkit-user-select: text; user-select: text; }
#logbar label { color: var(--dim); display: flex; gap: 5px; align-items: center; }
.tzhint { color: var(--dim); font-size: 11px; }
#lines { flex: 1; overflow-y: auto; padding: 8px 0; margin: 0;
         font: 11.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
         -webkit-user-select: text; user-select: text; }
.ln { padding: 0 12px; white-space: pre-wrap; word-break: break-word; }
.ltime { color: var(--dim); }
.llvl  { margin-left: 7px; }
.l-info { color: var(--dim); }
.l-warn { color: var(--warn); }
.l-error { color: var(--bad); font-weight: 600; }
.lid   { color: var(--dim); opacity: 0.55; margin-left: 6px; }
.lmsg  { margin-left: 6px; }
.ln.err  { color: var(--bad); background: #d13b300f; }
.ln.warn { color: var(--warn); }
.ln.head { color: var(--dim); }
#empty { color: var(--dim); padding: 20px 14px; }

#tabs { display: flex; gap: 2px; padding: 8px 10px 0; }
.tab { flex: none; font-size: 12px; font-weight: 500; padding: 5px 12px;
       border: none; background: none; color: var(--dim); border-radius: 6px; }
.tab:hover { background: #8080801a; color: var(--text); }
.tab.on { background: #80808026; color: var(--text); }
/* Тема — значком в углу строки вкладок: показан текущий режим, нажатие
   переключает на следующий. */
#btn-theme { flex: none; margin-left: auto; width: 26px; height: 24px; padding: 0;
             border: none; background: none; color: var(--dim); border-radius: 6px;
             display: inline-flex; align-items: center; justify-content: center; }
#btn-theme:hover { background: #8080801a; color: var(--text); }
#btn-theme svg { display: none; }
:root[data-theme="system"] #btn-theme .t-system,
:root[data-theme="light"]  #btn-theme .t-light,
:root[data-theme="dark"]   #btn-theme .t-dark { display: block; }

/* Раздел «как это работает»: читаемая колонка, не растягивается на всё окно. */
#how { flex: 1; overflow-y: auto; padding: 4px 22px 28px; line-height: 1.6; }
#how > * { max-width: 660px; }
#how h3 { font-size: 13px; margin: 22px 0 6px; letter-spacing: -0.1px; }
#how h3:first-child { margin-top: 14px; }
#how p  { margin: 0 0 8px; color: var(--text); }
#how .note { color: var(--dim); }
#how code { font: 11.5px/1.5 ui-monospace, Menlo, monospace;
            background: #80808024; padding: 1px 5px; border-radius: 4px; }
#how ol { margin: 6px 0; padding-left: 20px; }
#how li { margin: 3px 0; }
#how table { border-collapse: collapse; margin: 8px 0; width: 100%; }
#how td { padding: 5px 8px; border-top: 1px solid var(--line); vertical-align: top; }
#how td:first-child { color: var(--dim); width: 128px; white-space: nowrap; }
#how .box { border: 1px solid var(--line); border-radius: 8px; padding: 2px 12px;
            margin: 8px 0; background: var(--panel); }

/* Просмотр конфига поверх: ключи закрыты, показывать их незачем. */
#sheet { position: fixed; inset: 0; background: #00000055; display: none;
         align-items: center; justify-content: center; }
#sheet.on { display: flex; }
#sheet-box { background: var(--panel); border-radius: 12px; width: 460px;
             max-height: 74vh; display: flex; flex-direction: column;
             box-shadow: 0 12px 40px #00000040; }
#sheet-head { padding: 13px 16px; border-bottom: 1px solid var(--line);
              font-weight: 600; display: flex; }
/* Конфиг — моноширинным и с сохранением переносов, справка — обычным
   текстом, который переносится по ширине окна. */
#sheet-body.mono { font: 11.5px/1.6 ui-monospace, Menlo, monospace;
                   white-space: pre-wrap; }
#sheet-body p { margin: 0 0 10px; }
#sheet-body p:last-child { margin-bottom: 0; }
#sheet-body a { color: var(--accent); text-decoration: none; }
#sheet-body { padding: 14px 16px; overflow: auto;
              font: 12.5px/1.65 -apple-system, sans-serif;
              -webkit-user-select: text; user-select: text; }
#sheet-foot { padding: 11px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
.field { display: block; margin-bottom: 14px; }
.flabel { display: block; font-weight: 500; margin-bottom: 4px; }
.field input { width: 100%; font: inherit; padding: 5px 9px; border-radius: 6px;
               border: 1px solid var(--line); background: var(--bg); color: var(--text);
               -webkit-user-select: text; user-select: text; }
.field input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
/* Пояснение — обычным шрифтом: оно говорит, что вписать, и читать его
   обязательно. Пример — мелко и моноширинно, как сама строка ввода. */
.fopt  { font-weight: 400; color: var(--dim); }
.fwhat { display: block; font-size: 12px; color: var(--text); margin-bottom: 6px; }
.fex   { display: block; color: var(--dim); margin-top: 4px;
         font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }

/* Ошибка старта: причина словами и хвост лога прямо тут — искать её по
   логу справа, среди сотен строк sing-box, никто не станет. */
#errcard { padding: 11px 13px; display: flex; flex-direction: column; gap: 8px;
           border-color: #d13b3040; }
#err-more { white-space: pre-wrap; word-break: break-word;
            -webkit-user-select: text; user-select: text; }
#err-log { margin: 0; max-height: 150px; overflow: auto; padding: 7px 9px;
           border-radius: 6px; background: var(--logbg); border: 1px solid var(--line);
           font: 10.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
           /* Без переноса: трейсбек, порубленный по ширине колонки, не читается.
              Длинная строка прокручивается вбок. */
           white-space: pre; color: var(--dim);
           -webkit-user-select: text; user-select: text; }
#err-log .err { color: var(--bad); }
.btnrow { display: flex; gap: 7px; }

/* Операция идёт — окно закрыто целиком. Любое нажатие посреди выключения —
   гонка с уборкой маршрутов, а кнопка, которая «не нажимается», хуже, чем
   честное «подожди». Последние строки лога — чтобы было видно, что процесс
   идёт, а не завис. */
#busy { position: fixed; inset: 0; z-index: 50; display: flex;
        align-items: center; justify-content: center;
        background: color-mix(in srgb, var(--bg) 72%, transparent);
        -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
#busy-box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
            box-shadow: 0 12px 40px #00000030; padding: 18px 20px; width: 420px;
            max-width: calc(100vw - 32px); display: flex; flex-direction: column;
            align-items: center; gap: 8px; text-align: center; }
#busy-title { font-size: 15px; font-weight: 600; }
#busy-step { color: var(--dim); min-height: 1.45em; }
#busy-log { align-self: stretch; margin: 6px 0 0; padding: 7px 9px; border-radius: 6px;
            background: var(--logbg); border: 1px solid var(--line); text-align: left;
            font: 10.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
            color: var(--dim); white-space: pre; overflow: hidden; text-overflow: ellipsis;
            min-height: calc(4 * 1.5em + 14px); }
#busy-log:empty { display: none; }
.spinner { width: 22px; height: 22px; border-radius: 50%;
           border: 2.5px solid #80808040; border-top-color: var(--text);
           animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>

<div id="side">
  <div class="card">
    <div id="state">
      <div id="dot"></div>
      <div>
        <div id="state-title" data-en="connecting…">соединяюсь…</div>
        <div id="state-sub">&nbsp;</div>
      </div>
    </div>
    <div id="tunnels"></div>
  </div>

  <div id="errcard" class="card" hidden>
    <div id="err-more"></div>
    <pre id="err-log"></pre>
    <div class="btnrow">
      <button id="err-open-log" data-en="Full Log">Весь лог</button>
      <button id="err-dismiss" data-en="Hide">Скрыть</button>
    </div>
  </div>

  <button id="btn-install" class="primary" hidden data-en="Install Service…">Установить службу…</button>

  <div id="actions">
    <button id="btn-toggle" class="primary" data-en="Turn On">Включить</button>
    <button id="btn-restart" class="icon" title="Перезапустить" aria-label="Перезапустить"
            data-en-title="Restart">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.2v3.2h-3.2"/></svg>
    </button>
    <button id="btn-check" class="icon" title="Проверить связь" aria-label="Проверить связь"
            data-en-title="Check Connection">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1.5 8.5h3l1.8-4.5 3.2 8 1.8-3.5h3.2"/></svg>
    </button>
  </div>

  <div id="lockhint" hidden data-en="turn the VPN off to change configs">выключи VPN, чтобы менять конфиги</div>
  <div id="confs-wrap">
  <h2><span data-en="work">рабочий</span> <span class="info" data-info="corp"><svg width="14" height="14"
      viewBox="0 0 14 14" fill="none" stroke="currentColor"><circle cx="7" cy="7" r="6.5"/>
      <circle cx="7" cy="4.2" r="0.9" fill="currentColor" stroke="none"/>
      <path d="M7 6.1v4" stroke-width="1.4" stroke-linecap="round"/></svg></span>
    <span class="hacts">
      <button class="icon" id="btn-fetch" title="Обновить с сайта" aria-label="Обновить с сайта"
              data-en-title="Update from Website">

<script src="view.js"></script>
<script>
// Мост в Python: сообщения туда, вызовы render/renderLogs — обратно.
const send = (name, arg) =>
  window.webkit.messageHandlers.py.postMessage({name, arg: arg ?? null});

// Вызовы из Python идут через эту обёртку: WKWebView обезличивает исключения
// из evaluateJavaScript в «Script error» без строки и текста, а консоли у окна
// нет. Ловим здесь и отправляем настоящее сообщение в лог приложения.
function call(fn, arg) {
  try {
    window[fn](arg);
  } catch (e) {
    send('jserror', `${fn}: ${e && e.message} @${e && e.lineNumber}`);
  }
}

// Экранирование. Кавычки тоже: значения уходят в data-атрибуты, а имя
// конфига — это имя файла, которое пользователь волен назвать как угодно.
const esc = t => String(t).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let LAST = {};
let LOGLINES = [];     // последние строки лога — для окна ожидания
let CHECK_SENT = 0;    // когда нажали «Проверить»
let CHECK_SEEN = false;     // после нажатия probing_manual уже доходил до окна
const CHECK_GRACE = 4500;   // за это время итог проверки точно дойдёт до окна
let CHECKING_WAS = false;   // проверка шла в прошлом кадре
let FRESH_AT = 0;           // когда она закончилась
const FRESH_FOR = 1500;     // сколько держать подсветку новых цифр

// Каждая ветка отрисовки отчитывается один раз: если в ней исключение,
// сообщение не придёт, и selftest это увидит. Иначе «страница загрузилась»
// проходило бы даже при мёртвом рендере.
const done = {};
const prev = {};      // последняя отрисованная разметка, чтобы не топтать DOM
const tick = w => { if (!done[w]) { done[w] = 1; send('rendered', w); } };

const $ = id => document.getElementById(id);

// Статичная разметка — по-русски, английский лежит рядом в data-en*.
if (LANG === 'en') {
  document.querySelectorAll('[data-en]').forEach(el => { el.textContent = el.dataset.en; });
  document.querySelectorAll('[data-en-title]').forEach(el => {
    el.title = el.dataset.enTitle;
    el.setAttribute('aria-label', el.dataset.enTitle);
  });
  document.querySelectorAll('[data-en-ph]').forEach(el => { el.placeholder = el.dataset.enPh; });
}

function render(s) {
  LAST = s;
  const v = viewModel(s);

  $('dot').className = v.cls;
  $('state-title').textContent = v.title;
  const subEl = $('state-sub');
  // Сообщения (ошибка действия с файлом) красят эту строку. Без явного
  // сброса цвет оставался, и обычный текст показывался тревожным.
  if (!NOTICE) { subEl.textContent = v.sub || '\u00a0'; subEl.style.color = ''; }

  // Идёт ли ручная проверка — одно значение и для кнопки, и для строк. Раньше
  // кнопка крутилась по времени нажатия, а точки ждали probing_manual из
  // status.json; проверка короче опроса, флаг до окна часто не доходил, и
  // кнопка крутилась при старых цифрах. Теперь после нажатия считаем, что
  // проверка идёт, пока не увидим её конец или не выйдет CHECK_GRACE.
  if (v.check.probing) CHECK_SEEN = true;
  const pending = Date.now() - CHECK_SENT < CHECK_GRACE && !CHECK_SEEN && !v.check.disabled;
  const checking = v.check.probing || pending;
  // Проверка закончилась — подсвечиваем новые цифры на FRESH_FOR.
  if (CHECKING_WAS && !checking) {
    FRESH_AT = Date.now();
    setTimeout(() => render(LAST), FRESH_FOR);
  }
  CHECKING_WAS = checking;
  const fresh = Date.now() - FRESH_AT < FRESH_FOR ? ' fresh' : '';
  const tunnels = v.rows.map(r => {
    const hint = !r.toggleable ? tr('оба туннеля выключить нельзя — это «Выключить»',
                                    'can’t turn off both tunnels — use “Turn Off”')
               : r.off ? tr('нажми, чтобы включить', 'click to turn on')
               : tr('нажми, чтобы выключить', 'click to turn off');
    return `<div class="tun${r.toggleable ? ' toggle' : ''}${r.off ? ' off' : ''}"
       data-tunnel="${r.tunnel}" title="${esc(hint)}"><span class="tdot ${r.dot}" title="${esc(r.label)}" aria-label="${esc(r.label)}"></span>
       <span class="tun-name">${esc(r.name)}</span>
       <span class="tun-val">${esc(r.value)}</span>
       ${checking && !r.off ? `<span class="tun-ms measuring" aria-label="${tr('меряю', 'measuring')}"><i></i><i></i><i></i></span>`
         : r.ms ? `<span class="tun-ms${fresh}">${esc(r.ms)}</span>` : ''}</div>`;
  }).join('');
  if (tunnels !== prev.tunnels) { prev.tunnels = tunnels; $('tunnels').innerHTML = tunnels; }
  $('tunnels').hidden = !v.rows.length;

  renderError(v.error);
  renderBusy(v.busy);

  const t = $('btn-toggle'), r = $('btn-restart');
  t.textContent = v.toggle.label;
  t.classList.toggle('primary', v.toggle.primary);
  t.disabled = v.toggle.disabled;
  r.disabled = v.restart.disabled;
  const c = $('btn-check');
  c.classList.toggle('probing', checking);
  c.disabled = v.check.disabled || checking;

  $('btn-install').hidden = !v.install;
  $('actions').hidden = v.install;
  $('confs-wrap').classList.toggle('locked', v.locked);
  $('lockhint').hidden = !v.locked;
  tick('status');
}

function renderError(e) {
  $('errcard').hidden = !e;
  if (!e) return;
  $('err-more').textContent = e.more;
  $('err-more').hidden = !e.more;
  const html = e.log.map(l => {
    const bad = / ERROR |^ERROR|FATAL|Traceback|Error:/.test(l);
    return `<div class="${bad ? 'err' : ''}">${esc(l)}</div>`;
  }).join('');
  if (html !== prev.errlog) {
    prev.errlog = html;
    $('err-log').innerHTML = html;
    $('err-log').scrollTop = $('err-log').scrollHeight;
  }
  $('err-log').hidden = !e.log.length;
}

function renderBusy(b) {
  const box = $('busy');
  box.hidden = !b;
  if (!b) return;
  closeMenu();
  closeSheet();
  $('busy-title').textContent = b.title;
  $('busy-step').textContent = b.step;
  $('busy-log').textContent = LOGLINES.slice(-4).join('\n');
}

function renderConfs(d) {
  const sig = JSON.stringify(d);
  if (sig === prev.confs) { tick('confs'); return; }
  prev.confs = sig;
  // Список перерисовывается — меню повисло бы с именем файла, которого может
  // уже не быть, и «Удалить» ушло бы в никуда.
  closeMenu();

  // Раздел — у каждой строки: имя одно и то же может быть у рабочего и у личного.
  const rows = (list, kind) => list.map(c => `
    <div class="conf ${c.active ? 'active' : ''}" data-name="${esc(c.name)}"
         data-kind="${kind}">
      ${kind === 'personal' ? '<div class="conf-radio"></div>' : ''}
      <span class="conf-name">${esc(c.name)}</span>
      <button class="conf-menu" data-menu="${esc(c.name)}" data-kind="${kind}"
              title="${tr('Действия', 'Actions')}">⋯</button>
    </div>`).join('');

  document.getElementById('confs-corp').innerHTML =
    (d.corp_ambiguous
      ? `<div class="warnline">${tr('несколько рабочих конфигов — сборка не пройдёт, оставь один',
                                   'several work configs — the build will fail, keep one')}</div>`
      : '') +
    (rows(d.corp || [], 'corp') ||
      `<div class="emptyrow">${tr('рабочего конфига нет', 'no work config')}</div>`);

  document.getElementById('confs-personal').innerHTML =
    (rows(d.personal || [], 'personal') ||
      `<div class="emptyrow">${tr('личных конфигов нет', 'no personal configs')}</div>`);
  tick('confs');
}

// Выпадающее меню строки: удаление должно быть в одном клике, а не прятаться
// внутри просмотра — там его никто не найдёт.
function openMenu(kind, name, near) {
  closeMenu();
  const m = document.createElement('div');
  m.id = 'rowmenu';
  m.innerHTML = [tr('Показать', 'Show'), tr('Редактировать', 'Edit'), tr('Удалить', 'Delete')]
    .map((t, i) => `<button data-act="${['show','edit','del'][i]}"
                      class="${i === 2 ? 'danger' : ''}">${t}</button>`).join('');
  document.body.appendChild(m);
  const r = near.getBoundingClientRect();
  m.style.top = Math.max(8, Math.min(r.bottom + 4, innerHeight - m.offsetHeight - 8)) + 'px';
  m.style.left = Math.max(8, Math.min(r.left - 92, innerWidth - m.offsetWidth - 8)) + 'px';
  m.onclick = e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act;
    closeMenu();
    send(act === 'show' ? 'show_config' : act === 'edit' ? 'edit_config' : 'del_config',
         {kind, name});
  };
}

function closeMenu() {
  const m = document.getElementById('rowmenu');
  if (m) m.remove();
}
document.addEventListener('click', e => {
  if (!e.target.closest('#rowmenu') && !e.target.closest('[data-menu]')) closeMenu();
}, true);
// Меню позиционируется абсолютно и при прокрутке колонки отрывается от строки.
document.getElementById('side').addEventListener('scroll', closeMenu);

// Строка sing-box наполовину состоит из повторяющейся меты. Часовой пояс
// одинаков во всех строках, дата — тоже (лог на один запуск), а идентификатор
// соединения нужен редко, но именно по нему связываются строки одного
// соединения — поэтому не выбрасываем, а приглушаем.
const LOGLINE = /^\+\d{4}\s+\d{4}-\d{2}-\d{2}\s+(\d{2}:\d{2}:\d{2})\s+(\w+)\s*(\[[^\]]*\])?\s*(.*)$/;

function fmtLine(l) {
  const m = LOGLINE.exec(l);
  if (!m) return `<span class="lmsg">${esc(l)}</span>`;
  const [, time, lvl, id, rest] = m;
  return `<span class="ltime">${time}</span>` +
         `<span class="llvl l-${lvl.toLowerCase()}">${lvl}</span>` +
         (id ? `<span class="lid">${esc(id)}</span>` : '') +
         `<span class="lmsg">${esc(rest)}</span>`;
}

function renderLogs(lines) {
  LOGLINES = lines;
  if (LAST.op && LAST.op.busy) $('busy-log').textContent = lines.slice(-4).join('\n');
  const q = document.getElementById('search').value.toLowerCase();
  const onlyErr = document.getElementById('only-err').checked;
  const box = document.getElementById('lines');
  // Держим прокрутку у хвоста, только если пользователь и так внизу.
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;

  const out = lines.filter(l => {
    if (onlyErr && !/ ERROR |^ERROR/.test(l)) return false;
    return !q || l.toLowerCase().includes(q);
  }).map(l => {
    const cls = / ERROR |^ERROR/.test(l) ? 'err' : / WARN /.test(l) ? 'warn'
              : l.startsWith('===') || l.startsWith('→') ? 'head' : '';
    return `<div class="ln ${cls}">${fmtLine(l)}</div>`;
  }).join('');

  const html = out || `<div id="empty">${tr('ничего не найдено', 'nothing found')}</div>`;
  // Присваивание innerHTML сбрасывает прокрутку и снимает выделение текста.
  // Раз в две секунды это делало лог нечитаемым: ни отмотать, ни скопировать.
  if (html !== prev.logs) {
    prev.logs = html;
    box.innerHTML = html;
    if (atBottom) box.scrollTop = box.scrollHeight;
  }
  tick('logs');
}

function renderHowto(h) {
  const sig = JSON.stringify(h);
  if (sig === prev.howto) { tick('howto'); return; }
  prev.howto = sig;

  const ep = t => (h.endpoints || []).find(e => e.tag === t) || {};
  const p = ep('awg-personal'), c = ep('wg-corp');
  const unset = `<span class="note">${tr('не задано', 'not set')}</span>`;
  const nets = (h.corp_nets || []).map(n => `<code>${esc(n)}</code>`).join(' ') || unset;
  const doms = (h.corp_domains || []).map(d => `<code>${esc(d)}</code>`).join(' ') || unset;
  const resolvers = (h.resolvers || []).map(r => `<code>${esc(r)}</code>`).join(' ') || '—';

  document.getElementById('how').innerHTML = LANG === 'en' ? `
    <h3>Why two tunnels at once</h3>
    <p>A regular VPN client holds one connection: either work or personal.
    Here both are up at the same time, and each packet is routed to one of
    them. So corporate resources are reachable without turning off the
    personal tunnel, and vice versa.</p>

    <h3>Where a packet goes</h3>
    <p>Rules are checked in order, until the first match:</p>
    <ol>
      <li>address is in the corp subnets → <code>work tunnel</code></li>
      <li>address is local (<code>10/8</code>, <code>192.168/16</code>) → past the tunnels, to your network</li>
      <li>everything else → <code>${esc(h.final || 'personal tunnel')}</code></li>
    </ol>
    <div class="box"><p>Your corp subnets: ${nets}</p></div>

    <h3>Names and DNS</h3>
    <p>The corp server's address doesn't resolve from outside, so requests to
    ${doms} go to the corporate DNS
    <code>${esc(h.corp_dns || '—')}</code>, and the rest go to a public one through
    the personal tunnel. This is set by a file in <code>/etc/resolver</code>, not
    by the global network settings: ${resolvers}.</p>
    <p class="note">As a result, a short name like <code>git</code> won't work —
    use the full one: the /etc/resolver rule matches by suffix.</p>

    <h3>Which configs fit</h3>
    <p>Regular WireGuard files from your admin or your own server.
    Add them with ＋ in their section; the file name doesn't matter, the type
    is decided by the folder:</p>
    <table>
      <tr><td>work</td><td><code>conf/corp/</code>, exactly one file<br>
        <span class="note">regular WireGuard. Routes come from its
        <code>AllowedIPs</code> — whatever the admin put there goes into
        the work tunnel</span></td></tr>
      <tr><td>personal</td><td><code>conf/personal/</code>, as many as you like<br>
        <span class="note">WireGuard or AmneziaWG. The latter is a fork that
        obfuscates traffic (<code>Jc</code>, <code>S1</code>, <code>H1</code> and
        similar fields) so the ISP doesn't recognize the connection as VPN</span></td></tr>
    </table>
    <p class="note">The personal one is picked in the list on the left, by
    default the first. The work one is always connected and needs
    no choice.</p>

    <h3>Work config from the website</h3>
    <p>No need to ask the admin for a work config: ⟳ in the work section
    downloads a fresh one from <code>wg.media-effect.ru</code>. The site sends a
    code to your work email, you enter it in the window — and the new config
    replaces the old one; a running tunnel restarts.</p>
    <p class="note">The email comes from the work network settings (the gear);
    the first time, the window asks for it. The app doesn't read your mail and
    doesn't know its password — you copy the code yourself.</p>

    <h3>What's connected now</h3>
    <table>
      <tr><td>work</td><td><code>${esc(c.address || '—')}</code>  MTU ${esc(c.mtu || '—')}</td></tr>
      <tr><td>personal</td><td><code>${esc(p.address || '—')}</code>  MTU ${esc(p.mtu || '—')}${p.awg ? '  · obfuscated' : ''}</td></tr>
    </table>

    <h3>Why two programs</h3>
    <p>The tunnel changes the system routing table, which requires administrator
    rights. So it's owned by a background service started by the system, while
    this window is a regular app without special rights: it shows the state and
    sends the service two commands, turn on and turn off.</p>
    <p class="note">The service never starts on its own — not at boot, not after
    a crash: only when you click “Turn On”.</p>

    <h3>Updates</h3>
    <p>The window checks for new versions itself and shows “Update” at the
    bottom. The image is downloaded from GitHub and verified by checksum, then
    the system asks for the administrator password to replace the app in
    Applications. What's new is on the release page.</p>

    <h3>If something doesn't work</h3>
    <p>Look at the “corp” row on the left. If only it is silent while the personal
    tunnel is alive, the problem is in the work network, not in the app. If
    everything dropped after the laptop slept, “Restart” helps: sleep breaks the
    connection, and pages opened before stay hanging on dead connections.</p>` : `
    <h3>Зачем два туннеля сразу</h3>
    <p>Обычный VPN-клиент держит одно соединение: либо рабочее, либо личное.
    Здесь подняты оба одновременно, и для каждого пакета решается, в какой из
    них его отправить. Поэтому корпоративные ресурсы доступны, не отключая
    личный туннель, и наоборот.</p>

    <h3>Куда уходит конкретный пакет</h3>
    <p>Правила проверяются по порядку, до первого совпадения:</p>
    <ol>
      <li>адрес попадает в корп-подсети → <code>рабочий туннель</code></li>
      <li>адрес локальный (<code>10/8</code>, <code>192.168/16</code>) → мимо туннелей, в свою сеть</li>
      <li>всё остальное → <code>${esc(h.final || 'личный туннель')}</code></li>
    </ol>
    <div class="box"><p>Твои корп-подсети: ${nets}</p></div>

    <h3>Имена и DNS</h3>
    <p>Адрес корп-сервера снаружи не резолвится, поэтому запросы к
    ${doms} отправляются корпоративному DNS
    <code>${esc(h.corp_dns || '—')}</code>, а остальные — публичному через личный
    туннель. Это настроено файлом в <code>/etc/resolver</code>, а не общими
    настройками сети: ${resolvers}.</p>
    <p class="note">Следствие: короткое имя вроде <code>git</code> не сработает,
    нужно полное — правило в /etc/resolver срабатывает по суффиксу.</p>

    <h3>Какие конфиги подходят</h3>
    <p>Это обычные файлы WireGuard, которые выдаёт админ или личный сервер.
    Добавляются ＋ в своём разделе; имя файла не важно, тип задаёт папка:</p>
    <table>
      <tr><td>рабочий</td><td><code>conf/corp/</code>, ровно один файл<br>
        <span class="note">обычный WireGuard. Маршруты берутся из его
        <code>AllowedIPs</code> — что админ туда положил, то и пойдёт в
        рабочий туннель</span></td></tr>
      <tr><td>личный</td><td><code>conf/personal/</code>, сколько угодно<br>
        <span class="note">WireGuard или AmneziaWG. Второй — форк с маскировкой
        трафика (<code>Jc</code>, <code>S1</code>, <code>H1</code> и подобные
        поля), чтобы провайдер не опознавал соединение как VPN</span></td></tr>
    </table>
    <p class="note">Личный выбирается слева в списке, по умолчанию — первый.
    Рабочий подключается всегда и выбора не требует.</p>

    <h3>Рабочий конфиг с сайта</h3>
    <p>Рабочий конфиг не обязательно просить у админа: ⟳ у раздела рабочих
    скачивает свежий с <code>wg.media-effect.ru</code>. Сайт присылает код на
    рабочую почту, его вписываешь в окне — и новый конфиг встаёт на место
    старого, включённый туннель перезапускается.</p>
    <p class="note">Почта берётся из настроек рабочей сети (шестерёнка); в
    первый раз окно попросит её вписать. Письма программа не читает и пароля от
    почты не знает — код переносишь ты.</p>

    <h3>Что подключено сейчас</h3>
    <table>
      <tr><td>рабочий</td><td><code>${esc(c.address || '—')}</code>  MTU ${esc(c.mtu || '—')}</td></tr>
      <tr><td>личный</td><td><code>${esc(p.address || '—')}</code>  MTU ${esc(p.mtu || '—')}${p.awg ? '  · с маскировкой' : ''}</td></tr>
    </table>

    <h3>Почему это две программы</h3>
    <p>Туннель правит таблицу маршрутов системы, а на это нужны права
    администратора. Поэтому им владеет фоновая служба, запускаемая системой,
    а это окно — обычная программа без особых прав: она показывает состояние и
    посылает службе две команды, включить и выключить.</p>
    <p class="note">Служба сама не стартует — ни при загрузке Мака, ни после
    падения: только когда нажмёшь «Включить».</p>

    <h3>Обновления</h3>
    <p>Окно само проверяет, вышла ли новая версия, и показывает внизу
    «Обновить». Образ скачивается с GitHub и сверяется по контрольной сумме,
    потом система спросит пароль администратора — чтобы заменить приложение в
    Программах. Что нового в версии — на странице релиза.</p>

    <h3>Если что-то не работает</h3>
    <p>Смотри на строку «корп» слева. Если молчит она одна, а личный туннель
    жив — проблема в рабочей сети, а не в программе. Если пропало всё сразу
    после того, как ноутбук поспал, помогает «Перезапустить»: во сне соединение
    рвётся, и открытые до этого страницы остаются висеть на мёртвых соединениях.</p>`;
  tick('howto');
}

// Пока стоит — render не затирает строку состояния своим текстом.
let NOTICE = null;

function notice(msg, color, ms) {
  const el = document.getElementById('state-sub');
  NOTICE = msg;
  el.textContent = msg;
  el.style.color = color;
  clearTimeout(notice.t);
  notice.t = setTimeout(() => { NOTICE = null; render(LAST); }, ms);
}

// Ошибки действий с файлами и диалогами. Ошибки включения/выключения идут
// отдельным путём — через состояние контроллера и карточку ошибки.
function failed(msg) {
  notice(msg, 'var(--bad)', 7000);
}

function renderVersion(v) {
  const m = versionModel(v);
  const u = m.update;
  document.getElementById('version').innerHTML = esc(m.text) + (u
    ? `<div id="upd" class="${u.bad ? 'bad' : ''}">${esc(u.text)}` +
      (u.action ? ` — <a href="#" id="upd-go">${esc(u.action)}</a>` : '') + '</div>'
    : '');
}

// Домены рабочей сети раньше были зашиты в код. Теперь их задают здесь,
// иначе после выноса в файл задать их стало бы нечем. Пояснения — что вписать,
// а не что программа с этим делает: прошлые описывали внутреннюю логику.
// Порядок — по важности: без первых двух рабочая сеть не работает вовсе.
const SITE_FIELDS = [
  {key: 'CORP_DOMAINS', label: tr('Домены рабочей сети', 'Work network domains'),
   what: tr('Адреса внутри рабочей сети: их имена знает только рабочий DNS. Несколько — через пробел.',
            'Addresses inside the work network: only the work DNS knows their names. Separate several with spaces.'),
   example: 'corp.example.com example.local'},
  {key: 'CORP_PROBE', label: tr('Хост для проверки', 'Probe host'),
   what: tr('Любой внутренний адрес, который всегда работает. По нему окно решает, отвечает ли корп.',
            'Any internal address that is always up. The window uses it to tell whether corp responds.'),
   example: 'git.corp.example.com'},
  {key: 'CORP_HOSTS', label: tr('Хосты для диагностики', 'Diagnostic hosts'), optional: true,
   what: tr('Что дополнительно проверить, когда что-то не открывается.',
            'What else to check when something won’t open.'),
   example: 'git.corp.example.com wiki.corp.example.com'},
  {key: 'SB_CORP_EXCLUDE', label: tr('Не пускать через рабочий туннель', 'Keep out of the work tunnel'),
   optional: true,
   what: tr('Адреса, которые открываются только напрямую. Формат 1.2.3.4/32.',
            'Addresses that only open directly. Format 1.2.3.4/32.'),
   example: '198.51.100.7/32'},
  {key: 'CORP_EMAIL', label: tr('Рабочая почта', 'Work email'), optional: true,
   what: tr('На неё сайт конфигов пришлёт код, когда обновляешь рабочий конфиг значком ⟳ в заголовке.',
            'The config site sends a code here when you update the work config with ⟳ in the header.'),
   example: 'ivanov@media-effect.ru'},
];

// Подвал листа: у каждого вида свой набор кнопок, остальные прячем.
function sheetButtons(...ids) {
  ['sheet-del', 'sheet-load', 'sheet-save', 'sheet-apply']
    .forEach(id => { $(id).hidden = !ids.includes(id); });
}

function focusField(key) {
  const el = $('f-' + key);
  if (el) el.focus();
}

// Идёт запрос кода — значок крутится, как «Проверить связь».
function corpBusy(on) {
  const b = $('btn-fetch');
  b.classList.toggle('probing', on);
  b.disabled = on;
}

// Код пришёл на почту — спрашиваем его тут же, в листе поверх окна.
function showCode(d) {
  $('sheet-name').textContent = tr('Код из письма', 'Code from Email');
  const b = $('sheet-body');
  b.classList.remove('mono');
  b.innerHTML = `
    <p>${tr(`Код отправлен на ${esc(d.email)}, действует ${esc(d.minutes)} мин.`,
            `The code was sent to ${esc(d.email)}, valid for ${esc(d.minutes)} min.`)}
       <a href="#" id="open-mail">${tr('Открыть почту', 'Open Mail')}</a></p>
    <label class="field">
      <span class="flabel">${tr('Код', 'Code')}</span>
      <input id="f-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"
             spellcheck="false">
    </label>
    <div id="code-err" class="warnline" hidden></div>`;
  sheetButtons('sheet-apply');
  $('sheet-apply').disabled = false;
  $('sheet').classList.add('on');
  focusField('code');
}

// Ошибка остаётся в листе: код могли просто опечатать, форму не закрываем.
function codeError(msg) {
  $('code-err').textContent = msg;
  $('code-err').hidden = false;
  $('sheet-apply').disabled = false;
}

function sendCode() {
  const code = $('f-code').value.trim();
  if (!/^\d{6}$/.test(code)) { codeError('the code is 6 digits from the email'); return; }
  $('code-err').hidden = true;
  $('sheet-apply').disabled = true;
  send('corp_code', code);
}

function showSite(cur) {
  document.getElementById('sheet-name').textContent = tr('Рабочая сеть', 'Work Network');
  const b = document.getElementById('sheet-body');
  b.classList.remove('mono');
  b.innerHTML = SITE_FIELDS.map(f => `
    <label class="field">
      <span class="flabel">${f.label}${f.optional ? ` <span class="fopt">· ${tr('необязательно', 'optional')}</span>` : ''}</span>
      <span class="fwhat">${f.what}</span>
      <input id="f-${f.key}" value="${esc(cur[f.key] || '')}"
             spellcheck="false" autocapitalize="off" autocomplete="off">
      <span class="fex">${tr('например', 'e.g.')}: ${esc(f.example)}</span>
    </label>`).join('');
  sheetButtons('sheet-save', 'sheet-load');
  document.getElementById('sheet').classList.add('on');
}

// Поля заполняются из выбранного файла: набивать их руками, когда готовый
// site.env уже есть, — лишняя работа.
function fillSite(v) {
  SITE_FIELDS.forEach(({key}) => {
    const el = document.getElementById('f-' + key);
    if (el) el.value = v[key] || '';
  });
}

function closeSheet() {
  document.getElementById('sheet').classList.remove('on');
}

function showInfo(title, paras) {
  sheetButtons();
  document.getElementById('sheet-name').textContent = title;
  const b = document.getElementById('sheet-body');
  b.classList.remove('mono');
  // Абзацами, а не одним куском с переносами: иначе строки ломались там, где
  // я их набрал, и в конце абзаца оставалось по два слова.
  b.innerHTML = paras.map(t => `<p>${esc(t)}</p>`).join('');
  document.getElementById('sheet').classList.add('on');
}

function showConf(kind, name, text) {
  sheetButtons('sheet-del');
  document.getElementById('sheet-body').classList.add('mono');
  document.getElementById('sheet-name').textContent = name + '.conf';
  // Файл показывается целиком, включая ключи: он лежит на этой же машине,
  // и прятать его от владельца — только мешать копировать.
  document.getElementById('sheet-body').textContent = text;
  document.getElementById('sheet').classList.add('on');
  document.getElementById('sheet').dataset.name = name;
  document.getElementById('sheet').dataset.kind = kind;
}

// Кнопки только отправляют команду. Окно ожидания появится по сигналу
// контроллера — он же решает, можно ли сейчас что-то начинать.
document.getElementById('btn-toggle').onclick = () => send(LAST.up ? 'stop' : 'start');
document.getElementById('btn-install').onclick = () => send('install_daemon');
document.getElementById('btn-site').onclick = () => send('site');
document.getElementById('btn-fetch').onclick = () => send('corp_fetch');
document.getElementById('sheet-apply').onclick = sendCode;
// Enter в поле кода — то же, что «Применить»; ссылка на почту — в браузер.
document.getElementById('sheet-body').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'f-code') sendCode();
});
document.getElementById('sheet-body').addEventListener('click', e => {
  if (e.target.id !== 'open-mail') return;
  e.preventDefault();
  send('open_mail');
});
// Подвал перерисовывается целиком, поэтому слушаем на нём, а не на ссылке.
document.getElementById('version').onclick = e => {
  if (!e.target.closest('#upd-go')) return;
  e.preventDefault();
  send('update');
};
document.getElementById('sheet-load').onclick = () => send('load_site');
document.getElementById('sheet-save').onclick = () => {
  const v = {};
  SITE_FIELDS.forEach(({key}) => { v[key] = document.getElementById('f-' + key).value; });
  send('save_site', v);
};
document.getElementById('btn-restart').onclick = () => send('restart');
document.getElementById('tunnels').onclick = e => {
  const row = e.target.closest('.tun.toggle');
  if (row) send('toggle_tunnel', row.dataset.tunnel);
};
document.getElementById('btn-check').onclick = () => {
  CHECK_SENT = Date.now();
  CHECK_SEEN = false;
  send('check');
  render(LAST);
  setTimeout(() => render(LAST), CHECK_GRACE);
};
document.getElementById('err-dismiss').onclick = () => send('dismiss_error');
document.getElementById('err-open-log').onclick = () => {
  showTab('log');
  const onlyErr = document.getElementById('only-err');
  if (onlyErr.checked) { onlyErr.checked = false; send('logs'); }
  const box = document.getElementById('lines');
  box.scrollTop = box.scrollHeight;
};

document.getElementById('side').onclick = e => {
  const i = e.target.closest('[data-info]');
  if (i) { send('info', i.dataset.info); return; }
  const a = e.target.closest('[data-add]');
  if (a) send('add_config', a.dataset.add);
};

document.getElementById('search').oninput = () => send('logs');
document.getElementById('only-err').onchange = () => send('logs');
document.getElementById('sheet-close').onclick = closeSheet;
document.getElementById('sheet-del').onclick = () => {
  const {kind, name} = document.getElementById('sheet').dataset;
  send('del_config', {kind, name});
};

// Сообщаем Python, что страница поднялась: на этом держится сквозной тест —
// он проверяет всю цепочку от ресурса в бандле до моста обратно.
send('ready');

function showTab(name) {
  const log = name === 'log';
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.tab === name));
  document.getElementById('logbar').hidden = !log;
  document.getElementById('lines').hidden = !log;
  document.getElementById('how').hidden = log;
}

document.getElementById('tabs').onclick = e => {
  const t = e.target.closest('.tab');
  if (t) showTab(t.dataset.tab);
};

// Выбор темы окно подставляет до первой отрисовки (window.py, theme) — иначе
// при тёмной теме окно на миг вспыхивало бы светлым. Здесь только кнопка.
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  const b = document.getElementById('btn-theme');
  b.title = themeTitle(t);
  b.setAttribute('aria-label', themeTitle(t));
}
setTheme(THEMES.includes(document.documentElement.dataset.theme)
         ? document.documentElement.dataset.theme : 'system');
document.getElementById('btn-theme').onclick = () => {
  const t = nextTheme(document.documentElement.dataset.theme);
  setTheme(t);
  send('theme', t);
};

document.getElementById('side').addEventListener('click', e => {
  const mb = e.target.closest('[data-menu]');
  if (mb) { openMenu(mb.dataset.kind, mb.dataset.menu, mb); return; }
  const row = e.target.closest('.conf');
  if (row && row.dataset.kind === 'personal') send('use_config', row.dataset.name);
});
</script>
