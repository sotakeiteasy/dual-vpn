<!doctype html>
<meta charset="utf-8">
<title>VPN-lx</title>
<style>
/* Тема одна, тёмная, по палитре AmneziaVPN (AmneziaStyle.qml). Остальные
   оттенки — подложки статусов, наведение — выводятся из неё через color-mix,
   чтобы смена цвета не требовала правок по всему файлу. */
:root {
  color-scheme: dark;
  --bg:        #101012;              /* backgroundBase */
  --panel:     #18181b;              /* surfaceBase */
  --hover:     #232327;              /* surfaceHovered */
  --pressed:   #2c2d30;              /* surfacePressed */
  --line:      rgba(255, 255, 255, .08);
  --text:      #fafafa;              /* textPrimary */
  --dim:       #a1a1aa;              /* textTertiary */
  --off:       #71717a;
  --accent:    #fbb26a;              /* goldenApricot */
  /* На абрикосовом фоне белый текст не читается. */
  --on-accent: #0e0e11;
  --ok:        #3fbf6b;              /* vibrantGreen */
  --bad:       #eb5757;              /* vibrantRed */
  /* Жёлтый, а не оранжевый: иначе предупреждение сливается с акцентом. */
  --warn:      #f2c94c;
  --logbg:     var(--bg);
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --mono: "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
/* Без !important атрибут hidden проигрывает display:flex у самого элемента —
   поиск по логу оставался виден во вкладке «как это работает». */
[hidden] { display: none !important; }
/* Фон и у html: до раскладки body иначе мелькает белый кадр. */
html, body { height: 100%; margin: 0; background: var(--bg); }
body {
  font: 14px/1.5 var(--sans);
  color: var(--text); background: var(--bg);
  display: grid; grid-template-rows: auto 1fr; height: 100vh;
  overflow: hidden;                    /* прокручивается содержимое, не окно */
  -webkit-user-select: none; user-select: none;
}
/* min-height:0 обязателен: без него потомок сетки не сжимается ниже своего
   содержимого, и прокрутка уезжает на всё окно. */
.pane, #lines { min-height: 0; }
.pane { overflow-y: auto; }

/* ---------------------------------------------------------------- вкладки */
#tabs { display: flex; gap: 2px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
.tab { flex: none; font-size: 13px; font-weight: 500; padding: 5px 12px;
       border: none; background: none; color: var(--dim); border-radius: 6px; }
.tab:hover { background: var(--hover); color: var(--text); }
.tab.on { background: var(--pressed); color: var(--text); }

/* ---------------------------------------------------------------- туннели */
#pane-tunnels, #tiles-wrap { display: flex; flex-direction: column; gap: 12px; }
#pane-tunnels { padding: 14px 18px 18px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }

/* Главное состояние: крупно, одной фразой, чтобы читалось с расстояния. */
#state { padding: 13px 14px; display: flex; gap: 11px; align-items: center; }
#state-text { flex: 1; min-width: 0; }
#dot { width: 11px; height: 11px; border-radius: 50%; flex: none;
       background: var(--off); box-shadow: 0 0 0 3px transparent; }
#dot.ok   { background: var(--ok);   box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 18%, transparent); }
#dot.warn { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 18%, transparent); }
#dot.bad  { background: var(--bad);  box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 18%, transparent); }
#state-title { font-size: 16px; font-weight: 600; letter-spacing: -0.1px; }
#state-sub   { color: var(--dim); margin-top: 2px; }
#btn-check { padding-inline: 9px; }
#btn-check svg { width: 14px; height: 14px; display: block; }
#btn-check.spin svg { animation: check-spin .9s linear infinite; }
@keyframes check-spin { to { transform: rotate(360deg); } }

#actions { display: flex; gap: 7px; flex: none; }
/* flex:1 у button задуман для строк кнопок; в строке состояния и в колонке
   вкладки кнопка берёт ширину по своей подписи. */
#state button, #pane-tunnels > button { flex: none; }
#pane-tunnels > button { align-self: flex-start; }
button {
  font: inherit; font-weight: 500; color: var(--text); flex: 1;
  padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel); cursor: pointer;
}
/* :not(.primary) обязателен: иначе это правило перебивает фон акцента
   по специфичности, и на наведении главная кнопка теряла свой цвет. */
button:hover:not(:disabled):not(.primary) { background: var(--hover); }
button:active:not(:disabled):not(.primary) { background: var(--pressed); }
button:disabled { opacity: 0.45; cursor: default; }
/* Только после Tab (body.kbd): при показе окна WebView2 сам ставит фокус на
   первую кнопку, и рамка висела на «Включить/Выключить» без всякой клавиатуры. */
body.kbd button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.busy { color: var(--dim); }
button.primary { background: var(--accent); border-color: transparent; color: var(--on-accent);
                 font-weight: 600; }
button.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 85%, white); }

h2 { font-size: 12px; font-weight: 600; text-transform: uppercase;
     letter-spacing: 0.5px; color: var(--dim); margin: 4px 0 -4px 3px; }

/* Плитки: до трёх — каждая во всю строку, чтобы имя конфига и статус
   читались целиком; больше — сеткой. */
.tiles { display: grid; gap: 8px; grid-template-columns: 1fr; }
.tiles.many { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.tile { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; }
.tile.pick { cursor: pointer; }
.tile.pick:hover { background: var(--hover); }
.tile-mark { width: 11px; height: 11px; border-radius: 50%; flex: none; margin-top: 5px;
             background: var(--off); }
.tile-mark.ok   { background: var(--ok); }
.tile-mark.warn { background: var(--warn); }
.tile-mark.bad  { background: var(--bad); }
/* Запасной конфиг — пустой кружок переключателя: нажми, и он станет выбранным. */
.tile-mark.spare { background: none; border: 1.5px solid var(--dim); }
.tile-body { flex: 1; min-width: 0; }
.tile-name { font-weight: 600; overflow-wrap: anywhere; }
.tile-state { color: var(--dim); font-size: 13px; overflow-wrap: anywhere; }
.tile-state.ok   { color: var(--ok); }
.tile-state.warn { color: var(--warn); }
.tile-state.bad  { color: var(--bad); }
.tile-role { color: var(--dim); font-size: 12px; overflow-wrap: anywhere; }
.tile-add { flex: none; padding: 0; border: none; background: none; color: var(--accent);
            font-size: 13px; }
.tile-add:hover:not(:disabled) { background: none; text-decoration: underline; }
.tile-menu, .tile-test { flex: none; width: 24px; padding: 0; color: var(--dim);
                         background: none; border: none; border-radius: 5px; }
.tile-menu { line-height: 18px; font-size: 15px; }
.tile-test { height: 18px; }
.tile-menu:hover, .tile-test:hover:not(:disabled) { background: var(--pressed); color: var(--text); }
.tile-test svg { width: 13px; height: 13px; display: block; margin: auto; }
.tile-test.spin svg { animation: check-spin .9s linear infinite; }
.emptyrow { padding: 2px 3px; color: var(--dim); }

#rowmenu { position: fixed; z-index: 20; background: var(--panel); padding: 4px;
           border: 1px solid var(--line); border-radius: 8px; min-width: 132px;
           box-shadow: 0 8px 24px rgba(0, 0, 0, .5); display: flex; flex-direction: column; }
#rowmenu button { text-align: left; border: none; background: none; padding: 5px 9px;
                  border-radius: 5px; font-weight: 400; }
#rowmenu button:hover { background: var(--hover); }
#rowmenu button.danger { color: var(--bad); }

/* ---------------------------------------------------------------- журнал */
#pane-log { display: flex; flex-direction: column; background: var(--logbg); overflow: hidden; }
#logbar { display: flex; gap: 8px; align-items: center; padding: 9px 12px;
          border-bottom: 1px solid var(--line); }
#search { flex: 1; font: inherit; padding: 4px 9px; border-radius: 6px;
          border: 1px solid var(--line); background: var(--bg); color: var(--text);
          -webkit-user-select: text; user-select: text; }
#logbar label { color: var(--dim); display: flex; gap: 5px; align-items: center; }
.tzhint { color: var(--dim); font-size: 12px; }
#lines { flex: 1; overflow-y: auto; padding: 8px 0; margin: 0;
         font: 12.5px/1.6 var(--mono);
         -webkit-user-select: text; user-select: text; }
.ln { padding: 0 12px; white-space: pre-wrap; word-break: break-word; }
.ltime { color: var(--dim); }
.llvl  { margin-left: 7px; }
.l-info { color: var(--dim); }
.l-warn { color: var(--warn); }
.l-error { color: var(--bad); font-weight: 600; }
.lid   { color: var(--dim); opacity: 0.55; margin-left: 6px; }
.lmsg  { margin-left: 6px; }
.ln.err  { color: var(--bad); background: color-mix(in srgb, var(--bad) 7%, transparent); }
.ln.warn { color: var(--warn); }
.ln.head { color: var(--dim); }
#empty { color: var(--dim); padding: 20px 14px; }

/* -------------------------------------------------------------- настройки */
#pane-settings { display: flex; flex-direction: column; gap: 10px; padding: 16px 22px 14px; }
/* Настройки — флажками без рамки: это выбор, а не действие. */
.check-row { display: flex; gap: 7px; align-items: center; cursor: pointer; }
.check-row input { margin: 0; accent-color: var(--accent); }
.check-hint { color: var(--dim); font-size: 12px; margin: -8px 0 0 20px; }
/* Подвал: версия нужна, когда просят «а какая у тебя», но внимания к себе
   требовать не должна. */
#version { color: var(--dim); font-size: 12px; margin-top: auto; padding-top: 14px; }

/* «Как подключиться» и «как это работает»: читаемая колонка, не на всё окно. */
#how { line-height: 1.6; }
#how > * { max-width: 660px; }
#how h3 { font-size: 15px; margin: 22px 0 6px; letter-spacing: -0.1px; }
#how h3:first-child { margin-top: 14px; }
#how p  { margin: 0 0 8px; color: var(--text); }
#how .note { color: var(--dim); }
#how code { font: 12.5px/1.5 var(--mono);
            background: var(--hover); padding: 1px 5px; border-radius: 4px; }
#how ol { margin: 6px 0; padding-left: 20px; }
#how li { margin: 3px 0; }
#how table { border-collapse: collapse; margin: 8px 0; width: 100%; }
#how td { padding: 5px 8px; border-top: 1px solid var(--line); vertical-align: top; }
#how td:first-child { color: var(--dim); width: 128px; white-space: nowrap; }
#how .box { border: 1px solid var(--line); border-radius: 8px; padding: 2px 12px;
            margin: 8px 0; background: var(--panel); }

/* Просмотр конфига поверх: ключи закрыты, показывать их незачем. */
#sheet { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: none;
         align-items: center; justify-content: center; }
#sheet.on { display: flex; }
/* 640px — по подвалу «Туннелирования»: четыре кнопки в одну строку. */
#sheet-box { background: var(--panel); border-radius: 12px; width: 640px;
             max-height: 74vh; display: flex; flex-direction: column;
             border: 1px solid var(--line); box-shadow: 0 12px 40px rgba(0, 0, 0, .6); }
#sheet-head { padding: 13px 16px; border-bottom: 1px solid var(--line);
              font-weight: 600; display: flex; }
/* Конфиг — моноширинным и с сохранением переносов, справка — обычным
   текстом, который переносится по ширине окна. */
#sheet-body.mono { font: 12.5px/1.6 var(--mono);
                   white-space: pre-wrap; }
#sheet-body p { margin: 0 0 10px; }
#sheet-body p:last-child { margin-bottom: 0; }
#sheet-body { padding: 14px 16px; overflow: auto;
              font: 13.5px/1.65 var(--sans);
              -webkit-user-select: text; user-select: text; }
#sheet-foot { padding: 11px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
#sheet-foot button { white-space: nowrap; }
.field { display: block; margin-bottom: 14px; }
.flabel { display: block; font-weight: 500; margin-bottom: 4px; }
.field textarea { width: 100%; min-height: 96px; resize: vertical; padding: 5px 9px;
                  font: 12.5px/1.5 var(--mono); border-radius: 6px;
                  border: 1px solid var(--line); background: var(--bg); color: var(--text);
                  -webkit-user-select: text; user-select: text; }
.field textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.fhint { display: block; color: var(--dim); font-size: 12px; margin-top: 3px; }
.fnote { display: block; color: var(--dim); font-size: 12px; overflow-wrap: anywhere; }
.fnote.warn { color: var(--warn); }
#sheet-foot button.danger { color: var(--bad); }
</style>

<div id="tabs">
  <button class="tab on" data-tab="tunnels">Туннели</button>
  <button class="tab" data-tab="log">Журнал</button>
  <button class="tab" data-tab="settings">Настройки</button>
</div>

<div id="pane-tunnels" class="pane">
  <div class="card" id="state">
    <div id="dot"></div>
    <div id="state-text">
      <div id="state-title">соединяюсь…</div>
      <div id="state-sub">&nbsp;</div>
    </div>
    <div id="actions">
      <button id="btn-toggle" class="primary">Включить</button>
      <button id="btn-restart">Перезапустить</button>
      <button id="btn-check" title="Проверить туннели сейчас" aria-label="Проверить туннели">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/>
        </svg></button>
    </div>
    <button id="btn-install" class="primary" hidden>Установить службу…</button>
  </div>

  <div id="tiles-wrap">
    <div class="tiles" id="tiles"></div>
  </div>
  <button id="btn-add">+ Добавить конфиг…</button>
</div>

<div id="pane-log" class="pane" hidden>
  <div id="logbar">
    <input id="search" placeholder="поиск по журналу" spellcheck="false">
    <label><input type="checkbox" id="only-err"> только ошибки</label>
    <span class="tzhint" title="время местное">UTC+3</span>
  </div>
  <div id="lines"><div id="empty">журнала пока нет</div></div>
</div>

<div id="pane-settings" class="pane" hidden>
  <label class="check-row" id="autostart-row"><input type="checkbox" id="autostart">
    Включать VPN при запуске компьютера</label>
  <label class="check-row" id="verbose-row"><input type="checkbox" id="verbose">
    Подробный журнал sing-box</label>
  <div class="check-hint" id="verbose-hint">пока ищем причину сбоя, потом выключить:
    журнал растёт в разы. Туннели — сразу, маршрутизация и DNS — со следующего включения</div>
  <div id="how"></div>
  <div id="version"></div>
</div>

<div id="sheet">
  <div id="sheet-box">
    <div id="sheet-head"><span id="sheet-name"></span></div>
    <div id="sheet-body"></div>
    <div id="sheet-foot"></div>
  </div>
</div>

<script>
// Мост в Python. pywebview поднимает window.pywebview.api не мгновенно, а
// скрипт страницы выполняется сразу и первым делом шлёт 'ready'. Поэтому всё,
// что отправлено до готовности моста, копится в очереди и уходит следом —
// иначе первое же сообщение терялось бы молча.
const _outbox = [];
const _flush = () => {
  while (_outbox.length) {
    const m = _outbox.shift();
    window.pywebview.api.send(m.name, m.arg);
  }
};
const send = (name, arg) => {
  const m = {name, arg: arg ?? null};
  if (window.pywebview && window.pywebview.api) { _outbox.push(m); _flush(); }
  else _outbox.push(m);
};
window.addEventListener('pywebviewready', _flush);

// Вызовы из Python идут через эту обёртку: исключение внутри evaluate_js
// наружу не всплывает, а консоли у окна нет. Ловим здесь и отправляем
// настоящее сообщение в лог приложения.
function call(fn, arg) {
  try {
    window[fn](arg);
  } catch (e) {
    send('jserror', `${fn}: ${e && e.message} @${e && e.lineNumber}`);
  }
}

// То же для функций с несколькими аргументами (showConf, showInfo). Отдельная
// обёртка, а не спред в call: renderLogs принимает массив целиком, и спред
// разложил бы его на сотни аргументов.
function callN(fn, args) {
  try {
    window[fn].apply(null, args);
  } catch (e) {
    send('jserror', `${fn}: ${e && e.message} @${e && e.lineNumber}`);
  }
}

// Экранирование. Кавычки тоже: значения уходят в data-атрибуты, а имя
// конфига — это имя файла, которое пользователь волен назвать как угодно.
const esc = t => String(t).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let LAST = {};
let PENDING = null;    // команда отправлена, состояние ещё не догнало
let AUTOSTART_PENDING = false;
let VERBOSE_PENDING = false;
let CHECKING = false;  // идёт проверка туннелей по кнопке или при открытии
// id туннелей этой проверки, чей ответ ещё не пришёл: быстрый не ждёт молчащего.
let CHECK_LEFT = new Set();
// Проверки конфигов по ↻, чей ответ ещё не пришёл: «id/имя». Статус покажет
// checking только со следующим опросом — без этого кнопка молчала бы секунды.
const TESTING = new Set();
// seq проверки туннеля на момент ↻: у выбранного конфига живого VPN итог теста
// виден, пока туннель не проверили заново, — потом свежее его проверка.
const TESTED = {};
let RULES = null;      // туннель открытого листа «Туннелирование», списки — сохранённые

// В окне туннель зовётся своим конфигом (решение #12), имя туннеля — запасное.
const tname = t => t.active || t.name;
const hasConf = t => !!(t.confs || []).length;
const testKey = (id, name) => `${id}/${name}`;
const testOf = (t, name) => (t.tests || {})[name];
const testing = (t, name) => TESTING.has(testKey(t.id, name)) || !!(testOf(t, name) || {}).checking;

// Рестарт нельзя ждать сравнением с желаемым состоянием: жмут его при поднятом
// туннеле, и «уже как надо» получается сразу. Ждём полный цикл: упал и поднялся.
function busyNow(s) {
  if (!PENDING) return false;
  if (Date.now() - PENDING.at > 25000) return false;   // страховка от залипания
  if (PENDING.mode === 'restart') {
    if (!s.up) PENDING.sawDown = true;
    return !(PENDING.sawDown && s.up);
  }
  return s.up !== PENDING.want;
}

// Каждая ветка отрисовки отчитывается один раз: если в ней исключение,
// сообщение не придёт, и selftest это увидит. Иначе «страница загрузилась»
// проходило бы даже при мёртвом рендере.
const done = {};
const prev = {};      // последняя отрисованная разметка, чтобы не топтать DOM
const tick = w => { if (!done[w]) { done[w] = 1; send('rendered', w); } };

function render(s) {
  LAST = s;
  const up = s.up, leak = s.v6_leak;
  const T = s.tunnels || [];
  const main = T.find(t => t.mode === 'all');
  // Пока идёт проверка — по кнопке, при открытии окна или сама после подъёма
  // туннеля — прежний ответ устарел: «молчит» от прошлой проверки читалось
  // бы как свежий результат. Каждый туннель по себе: молчащий не держит
  // «проверяю» у остальных.
  const checking = t => up && ((CHECKING && CHECK_LEFT.has(t.id)) || !!t.checking);
  // Основной не работает, и служба увела выход напрямую: адрес провайдера
  // тогда ожидаем, это не утечка. Без основного напрямую идёт всё — так задумано.
  const direct = !!main && (s.out === 'direct' || s.exit_state === 'direct');
  // «По списку» молчит, а остальное работает — отдельный случай, не «всё сломалось».
  const silent = up ? T.filter(t => t.mode === 'list' && t.check === 'error' && !checking(t)) : [];

  // Первый запуск: без службы кнопки бессмысленны, поэтому вместо них
  // предложение её поставить — иначе человек нажимает «Включить» и ничего
  // не происходит.
  const noDaemon = s.daemon === false;
  // Туннель без конфига сборка пропускает, без всех — не соберёт
  // (buildconfig.py:build). Говорим заранее, а не «Не запускается» после нажатия.
  const missing = !up && !!s.tunnels && !T.some(hasConf);

  let cls = 'off', title = 'Выключено', sub = 'туннели не подняты';
  if (noDaemon) { cls='warn'; title='Нужна установка';
                  sub='фоновая служба ещё не поставлена'; }
  else if (missing) { cls='warn'; title='Добавь конфиг'; sub='без него VPN не включится'; }
  // Служба сама снимает и поднимает туннель: на это время up ложный, и без
  // этой ветки заголовок мигал бы «Выключено» или прошлой ошибкой.
  else if (s.busy === 'переподключаю') { cls='warn'; title='Переподключаю';
                  sub='сменилась сеть — поднимаю туннель заново'; }
  // Сторож перезапускает процесс одного туннеля: up при этом истинный, tun цел.
  else if (up && (s.busy || '').startsWith('перезапускаю')) { cls='warn'; title='Перезапускаю';
                  sub=s.busy + ', интернет работает'; }
  else if (leak) { cls='bad';  title='Утечка IPv6';        sub='часть трафика идёт мимо туннеля: ' + leak; }
  // Не поднялся и не просто выключен — показываем причину, а не пустоту.
  else if (!up && s.last_error) { cls='bad'; title='Не запускается'; sub = s.last_error; }
  else if (!up)  { cls='off';  title='Выключено';          sub='туннели не подняты'; }
  // Заголовок обязан отражать плитки ниже, иначе получается прямое
  // противоречие: сверху «всё работает», а у основного — «мимо туннеля».
  else if (direct) { cls='warn'; title='Запасной выход';
                     sub=`«${tname(main)}» не работает, интернет идёт напрямую`; }
  else if (s.exit_state === 'leak') { cls='bad'; title='Трафик мимо туннеля';
                                      sub='тебя видно адресом провайдера ' + (s.exit_ip || ''); }
  else if (silent.length) { cls='warn';
                  title = silent.length === 1 ? `«${tname(silent[0])}» не отвечает` : 'Туннели не отвечают';
                  sub = silent.length < T.length ? 'остальные туннели работают' : 'туннели подняты, но молчат'; }
  else           { cls='ok';   title='Всё работает';
                   sub = !main ? 'всё остальное — напрямую, без VPN'
                       : T.length > 1 ? 'туннели подняты' : 'туннель поднят'; }

  document.getElementById('dot').className = cls;
  document.getElementById('state-title').textContent = title;
  const subEl = document.getElementById('state-sub');
  // Сообщения (ошибка команды, «перезапускаю») красят эту строку. Без явного
  // сброса цвет оставался, и обычный текст показывался тревожным.
  if (!NOTICE) { subEl.textContent = sub; subEl.style.color = ''; }

  renderTiles(s, checking, direct);

  // Пока команда не отработала, состояние ещё старое. Без этого кнопка
  // выглядела мёртвой: нажал — ничего не изменилось, и хочется нажать снова.
  const t = document.getElementById('btn-toggle');
  const r = document.getElementById('btn-restart');
  const wasRestart = PENDING && PENDING.mode === 'restart';
  const busy = busyNow(s);
  if (PENDING && !busy) {
    PENDING = null;
    // Перезапуск закончился раньше таймаута — незачем держать подпись
    // «применяю конфиг», пока заголовок говорит уже что-то другое.
    if (wasRestart && NOTICE) { NOTICE = null; clearTimeout(notice.t); }
  }

  t.disabled = r.disabled = busy;
  t.classList.toggle('busy', busy);
  r.classList.toggle('busy', busy);
  if (busy && wasRestart) {
    t.textContent = up ? 'Выключить' : 'Включить';
    r.textContent = 'перезапускаю…';
  } else if (busy) {
    t.textContent = PENDING.want ? 'включаю…' : 'выключаю…';
    r.textContent = 'Перезапустить';
  } else {
    t.textContent = up ? 'Выключить' : 'Включить';
    t.classList.toggle('primary', !up);
    r.textContent = 'Перезапустить';
    r.disabled = !up;
    if (missing) t.disabled = true;
  }
  // Служба занята своей операцией (команда из трея, переподключение) —
  // команда из окна вернула бы только «уже идёт».
  if (s.busy) t.disabled = r.disabled = true;
  const c = document.getElementById('btn-check');
  c.disabled = busy || CHECKING || !!s.busy;
  c.classList.toggle('spin', CHECKING);
  document.getElementById('btn-install').hidden = !noDaemon;
  document.getElementById('actions').hidden = noDaemon;
  const noSvc = noDaemon || !!s.no_service;
  document.getElementById('tiles-wrap').hidden = !s.tunnels;
  document.getElementById('btn-add').disabled = noSvc;
  ['autostart-row', 'verbose-row', 'verbose-hint'].forEach(id => {
    document.getElementById(id).hidden = noSvc;
  });
  // Пока идёт запрос (там UAC), опрос не должен вернуть флажок назад —
  // иначе он мигает под рукой, пока человек жмёт «Да».
  const auto = document.getElementById('autostart');
  if (!AUTOSTART_PENDING) auto.checked = !!s.autostart;
  auto.disabled = AUTOSTART_PENDING;
  const verbose = document.getElementById('verbose');
  if (!VERBOSE_PENDING) verbose.checked = s.log_level === 'debug';
  verbose.disabled = VERBOSE_PENDING;
  tick('status');
}

// Плитка: [цвет, подпись]. Без VPN мерить нечем — показываем, как туннель
// отработал в прошлый раз: сломанный заменяют до включения, а не после.
// Серым: зелёная «выключен · работал» читалась как «работает». Проверка
// конфига (↻, после добавления) свежее прошлого раза — тогда её итог.
function tileState(t, s, checking, direct) {
  if (!hasConf(t)) return ['warn', 'нет конфига'];
  const name = t.active || t.confs[0];
  const test = testOf(t, name);
  if (testing(t, name)) return ['warn', 'проверяю…'];
  if (!s.up) return test ? testState(test, 'выключен · ')
                  : t.last === 'error' ? ['bad', 'выключен · раньше не работал']
                  : t.last === 'up' ? ['off', 'выключен · раньше работал'] : ['off', 'выключен'];
  // Итог ↻ на живом VPN — пока туннель не проверили заново.
  const fresh = test && t.seq === TESTED[testKey(t.id, name)] ? testState(test, '') : null;
  if (t.mode === 'all') {
    if (direct) return ['bad', 'не работает · выход напрямую'];
    if (checking(t)) return ['warn', 'проверяю…'];
    if (s.exit_state === 'leak') return ['bad', 'мимо туннеля'];
    if (fresh) return fresh;
    if (t.check === 'up') return ['ok', `через туннель ${t.answer || ''}`.trim()];
    if (t.check === 'error') return ['bad', 'не работает'];
    return ['warn', 'проверяю…'];
  }
  if (checking(t)) return ['warn', 'проверяю…'];
  if (fresh) return fresh;
  if (t.check === 'up') return ['ok', `отвечает ${t.answer || ''}`.trim()];
  // Сервер отвечает, а домен из «пускать» его DNS не знает: правила от другой сети.
  if (t.check === 'rules') return ['warn',
    `работает · «${t.answer || ''}» через него не открывается — проверь туннелирование`];
  if (t.check === 'error') return ['bad', 'молчит'];
  if (t.check === 'none') return ['off', 'не с чем проверить: ни DNS в конфиге, ни домена в «пускать»'];
  return ['warn', 'проверяю…'];
}

// Итог проверки конфига (Core._test_conf): отвечает ли его сервер — без VPN,
// у запасного или по ↻. prefix — чем плитка была бы без теста.
function testState(r, prefix) {
  const a = r.answer || '';
  if (r.result === 'up') return ['ok', `${prefix}проверен: работает${a ? ', ' + a : ''}`];
  if (r.result === 'rules') return ['warn',
    `${prefix}сервер отвечает · «${a}» через него не открывается — проверь туннелирование`];
  if (r.result === 'error') return ['bad', `${prefix}проверен: не работает${a ? ' — ' + a : ''}`];
  if (r.result === 'none') return ['off',
    `${prefix}не с чем проверить: ни DNS в конфиге, ни домена в «пускать»`];
  return ['off', `${prefix}проверить не удалось`];
}

// Запасной: кружок пустой — выбора нет, цвет и текст — от теста, если был.
function spareState(t, name) {
  const test = testOf(t, name);
  if (testing(t, name)) return ['warn', 'запасной · проверяю…'];
  return test ? testState(test, 'запасной · ') : ['', 'запасной'];
}

function records(n) {
  const d = n % 10, h = n % 100;
  const w = d === 1 && h !== 11 ? 'запись'
          : d >= 2 && d <= 4 && (h < 12 || h > 14) ? 'записи' : 'записей';
  return `${n} ${w}`;
}

// Что туннель забирает: всё остальное или только свой список (rules — записей в
// «пускать» и «не пускать»; без них — сети AllowedIPs его конфига).
function tileRole(t) {
  if (t.mode === 'all') return 'всё остальное через него';
  return t.rules ? `только по списку: ${records(t.rules)}` : 'только сети своего конфига';
}

function tileHtml(t, name, mark, state, pick, role) {
  const [cls, text] = state;
  // Туннель без конфига: правила оставили — плитка зовёт добавить файл в него.
  const add = hasConf(t) ? ''
    : ` · <button class="tile-add" data-add-to="${esc(t.id)}">Добавить…</button>`;
  const busy = name && testing(t, name);
  const test = !name ? '' : `
      <button class="tile-test${busy ? ' spin' : ''}" data-test="${esc(t.id)}" data-name="${esc(name)}"
              title="Проверить конфиг" aria-label="Проверить конфиг"${busy ? ' disabled' : ''}>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/>
        </svg></button>`;
  return `
    <div class="card tile${pick ? ' pick' : ''}" data-id="${esc(t.id)}" data-name="${esc(name)}">
      <span class="tile-mark ${mark}"></span>
      <div class="tile-body">
        <div class="tile-name">${esc(name || t.name)}</div>
        <div class="tile-state ${cls}">${esc(text)}${add}</div>
        ${role ? `<div class="tile-role">${esc(role)}</div>` : ''}
      </div>${test}
      <button class="tile-menu" data-menu="${esc(t.id)}" data-name="${esc(name)}"
              title="Действия" aria-label="Действия">⋯</button>
    </div>`;
}

function setTiles(id, html, count) {
  const el = document.getElementById(id);
  el.classList.toggle('many', count > 3);
  // Присваивание innerHTML раз в две секунды снимало бы наведение и фокус.
  if (prev[id] !== html) { prev[id] = html; el.innerHTML = html; }
}

// Один список в порядке tunnels.json (решение #15): на маршрут порядок не
// влияет — одну запись у двух туннелей служба не пустит. У основного —
// плитка на каждый конфиг: выбранный со статусом, за ним запасные. Прямой
// выход — запасной путь службы, а не конфиг: плитки у него нет.
function renderTiles(s, checking, direct) {
  const T = s.tunnels || [];
  // Сменился состав — меню повисло бы над конфигом, которого может уже не быть.
  const shape = JSON.stringify(T.map(t => [t.id, t.mode, t.active, t.confs]));
  if (shape !== prev.shape) { prev.shape = shape; closeMenu(); }

  const tiles = [];
  T.forEach(t => {
    const st = tileState(t, s, checking, direct);
    if (t.mode !== 'all' || !hasConf(t)) {
      tiles.push(tileHtml(t, t.active || (t.confs || [])[0] || '', st[0], st, false, tileRole(t)));
      return;
    }
    const confs = t.confs.includes(t.active)
      ? [t.active, ...t.confs.filter(c => c !== t.active)] : t.confs;
    confs.forEach(c => tiles.push(c === t.active
      ? tileHtml(t, c, st[0], st, false, tileRole(t))
      : tileHtml(t, c, 'spare', spareState(t, c), true)));
  });
  setTiles('tiles', tiles.join(''), tiles.length);
}

// Выпадающее меню плитки: items — [подпись, действие, danger].
function openMenu(items, near) {
  closeMenu();
  const m = document.createElement('div');
  m.id = 'rowmenu';
  m.innerHTML = items.map(([label, , danger], i) =>
    `<button data-i="${i}" class="${danger ? 'danger' : ''}">${label}</button>`).join('');
  document.body.appendChild(m);
  const r = near.getBoundingClientRect();
  m.style.top = Math.max(8, Math.min(r.bottom + 4, innerHeight - m.offsetHeight - 8)) + 'px';
  m.style.left = Math.max(8, Math.min(r.right - m.offsetWidth, innerWidth - m.offsetWidth - 8)) + 'px';
  m.onclick = e => {
    const b = e.target.closest('[data-i]');
    if (!b) return;
    closeMenu();
    items[+b.dataset.i][1]();
  };
}

function closeMenu() {
  const m = document.getElementById('rowmenu');
  if (m) m.remove();
}
document.addEventListener('click', e => {
  if (!e.target.closest('#rowmenu') && !e.target.closest('[data-menu]')) closeMenu();
}, true);
// Меню позиционируется абсолютно и при прокрутке отрывается от плитки.
document.getElementById('pane-tunnels').addEventListener('scroll', closeMenu);

const setMode = (tunnel, mode) => send('set_mode', {tunnel, mode});

function tileMenu(id, name, near) {
  const T = LAST.tunnels || [];
  const main = T.find(x => x.mode === 'all');
  const t = T.find(x => x.id === id);
  if (!t) return;
  const arg = {tunnel: id, name};
  const rules = ['Туннелирование…', () => send('tunnel_rules', id)];
  const show = ['Показать', () => send('show_config', arg)];
  const edit = ['Редактировать', () => send('edit_config', arg)];
  const del = ['Удалить', () => delConfig(t, name), true];
  if (!name) {
    openMenu([rules, ['Удалить туннель', () => send('del_tunnel', id), true]], near);
  } else if (t.mode === 'all') {
    openMenu(name === t.active
      ? [rules, show, edit, ['Всё остальное напрямую', () => setMode(id, 'list')], del]
      : [show, edit, ['Отдельным туннелем по списку',
                      () => send('move_config', {...arg, to: 'new'})], del], near);
  } else {
    // Всё остальное — только через конфиг с 0.0.0.0/0: иначе его сервер отбросит
    // чужой трафик (служба тоже откажет). Запасным — если основной уже есть.
    const full = t.full ? [['Всё остальное через этот туннель', () => setMode(id, 'all')],
                           ...(main ? [[`Запасным к «${esc(tname(main))}»`, () => moveToAll(t, name)]] : [])]
                        : [];
    openMenu([rules, show, edit,
              ['Заменить файл…', () => send('add_config', {tunnel: id, place: 'replace'})],
              ...full, del], near);
  }
}

// Последний конфиг туннеля уходит: правила без него бесполезны, но набраны
// руками — есть они, спрашиваем; нет — туннель уходит вместе с конфигом.
function dropAsk(t, act) {
  if ((t.confs || []).length > 1) return act(false);
  if (!t.rules) return act(true);
  openSheet(`Последний конфиг «${tname(t)}»`,
    `<p>У туннеля есть правила туннелирования (${t.rules}). Оставить их до
     нового конфига или удалить туннель вместе с ними?</p>`,
    [['Оставить правила', () => act(false)],
     ['Удалить вместе', () => act(true), 'danger'],
     ['Отмена', closeSheet]]);
}
const delConfig = (t, name) =>
  dropAsk(t, drop => send('del_config', {tunnel: t.id, name, drop_tunnel: drop}));
const moveToAll = (t, name) =>
  dropAsk(t, drop => send('move_config', {tunnel: t.id, name, to: 'all', drop_tunnel: drop}));

// Строка sing-box наполовину состоит из повторяющейся меты. Часовой пояс
// одинаков во всех строках, дата — тоже (лог на один запуск), а идентификатор
// соединения нужен редко, но именно по нему связываются строки одного
// соединения — поэтому не выбрасываем, а приглушаем.
const LOGLINE = /^\+\d{4}\s+\d{4}-\d{2}-\d{2}\s+(\d{2}:\d{2}:\d{2})\s+(\w+)\s*(\[[^\]]*\])?\s*(.*)$/;

function fmtLine(l) {
  const m = LOGLINE.exec(l);
  if (!m) return `<span class="lmsg">${esc(l)}</span>`;
  const [, time, lvl, id, rest] = m;
  return `<span class="ltime">${time}</span>` +
         `<span class="llvl l-${lvl.toLowerCase()}">${lvl}</span>` +
         (id ? `<span class="lid">${esc(id)}</span>` : '') +
         `<span class="lmsg">${esc(rest)}</span>`;
}

// Последние полученные строки: поиск и «только ошибки» фильтруют их здесь.
// Раньше каждая буква в поиске шла запрос в службу, и окно подвисало.
let logLines = [];

function renderLogs(lines) {
  logLines = lines;
  const q = document.getElementById('search').value.toLowerCase();
  const onlyErr = document.getElementById('only-err').checked;
  const box = document.getElementById('lines');
  // Держим прокрутку у хвоста, только если пользователь и так внизу.
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;

  const out = lines.filter(l => {
    if (onlyErr && !/ ERROR |^ERROR/.test(l)) return false;
    return !q || l.toLowerCase().includes(q);
  }).map(l => {
    const cls = / ERROR |^ERROR/.test(l) ? 'err' : / WARN /.test(l) ? 'warn'
              : l.startsWith('===') || l.startsWith('→') ? 'head' : '';
    return `<div class="ln ${cls}">${fmtLine(l)}</div>`;
  }).join('');

  const html = out || '<div id="empty">ничего не найдено</div>';
  // Присваивание innerHTML сбрасывает прокрутку и снимает выделение текста.
  // Раз в две секунды это делало лог нечитаемым: ни отмотать, ни скопировать.
  if (html !== prev.logs) {
    prev.logs = html;
    box.innerHTML = html;
    if (atBottom) box.scrollTop = box.scrollHeight;
  }
  tick('logs');
}

function renderHowto(h) {
  // Имена туннелей — из статуса: в собранном конфиге только теги wg-<id>.
  const T = LAST.tunnels || [];
  const names = Object.fromEntries(T.map(t => ['wg-' + t.id, tname(t)]));
  const sig = JSON.stringify([h, names]);
  if (sig === prev.howto) { tick('howto'); return; }
  prev.howto = sig;

  const eps = (h.endpoints || []).map(e => `
    <tr><td>${esc(names[e.tag] || e.tag)}</td><td><code>${esc(e.address || '—')}</code>
      MTU ${esc(e.mtu || '—')}${e.awg ? '  · с маскировкой' : ''}</td></tr>`).join('');
  const codes = l => l.map(x => `<code>${esc(x)}</code>`).join(' ');
  const nets = h.corp_nets || [], doms = h.corp_domains || [];
  const work = T.find(t => t.mode === 'list');
  // Подсети и домены служба отдаёт только окну с правами (service._howto).
  const listBox = work && (nets.length || doms.length) ? `
    <div class="box"><p>«${esc(tname(work))}»: сети ${codes(nets) || '—'},
      домены ${codes(doms) || '—'}, DNS <code>${esc(h.corp_dns || '—')}</code></p></div>` : '';

  document.getElementById('how').innerHTML = `
    <h3>Как подключиться</h3>
    <p>Нужен обычный файл WireGuard или AmneziaWG — его выдаёт админ или твой
    сервер. Нажми «+ Добавить конфиг…» на вкладке «Туннели»: место конфиг
    выбирает сам, по своему <code>AllowedIPs</code>:</p>
    <ol>
      <li>есть <code>0.0.0.0/0</code> → в туннель, через который идёт всё остальное;
        если в нём уже есть конфиг, новый ляжет запасным — переключить можно
        кликом по плитке;</li>
      <li>конкретные сети → новый туннель «по списку»;</li>
      <li>тот же частный DNS, что у туннеля «по списку», → заменяет его конфиг,
        правила туннелирования остаются;</li>
      <li>сети пересекаются с туннелем «по списку» → окно спросит: заменить или
        добавить отдельным туннелем.</li>
    </ol>
    <p class="note">Правки при включённом VPN применяются перезапуском туннеля.</p>
    <h3>Подключено сейчас</h3>
    <table>${eps || '<tr><td>—</td><td class="note">VPN ещё не собирался</td></tr>'}</table>
    ${listBox}

    <h3>Как это работает</h3>
    <p>Все туннели подняты одновременно, и для каждого соединения решается, в
    какой из них его отправить. Правила проверяются по порядку, до первого
    совпадения:</p>
    <ol>
      <li>туннели «только по списку»: адрес или домен из «Пускать через
        туннель» или из <code>AllowedIPs</code> конфига, если его нет в «Не пускать».
        Одна запись — у одного туннеля: адрес из сетей чужого конфига сначала
        впиши тому в «Не пускать», поэтому порядок туннелей не важен;</li>
      <li>локальные адреса (<code>10/8</code>, <code>192.168/16</code>) → мимо
        туннелей, в свою сеть;</li>
      <li>«Мимо VPN» основного туннеля → напрямую;</li>
      <li>всё остальное → в туннель с «Всё остальное через этот туннель» (меню ⋯
        плитки), а без него или пока он не работает — напрямую.</li>
    </ol>
    <p class="note">Домен из «пускать» узнаётся по имени сайта в соединении
    (SNI, Host). SSH, RDP и прочее без имени пойдут в туннель, только если их
    адрес есть в списке или в <code>AllowedIPs</code>.</p>

    <h3>Имена и DNS</h3>
    <p>Домены из «пускать» туннеля, у конфига которого задан
    <code>DNS</code>, резолвит этот DNS через сам туннель: рабочие имена снаружи
    не резолвятся. Остальные — публичный DNS. Разводит их сам sing-box, отдельных
    правил Windows для этого не нужно.</p>
    <p class="note">Короткое имя вроде <code>git</code> не сработает, нужно
    полное — правило срабатывает по суффиксу домена.</p>

    <h3>Почему это две программы</h3>
    <p>Туннель правит таблицу маршрутов системы, а на это нужны права
    администратора. Поэтому им владеет фоновая служба Windows, а это окно —
    обычная программа: показывает состояние и передаёт службе команды. Правка
    конфигов и правил спрашивает права отдельно, на одно действие.</p>

    <h3>Если что-то не работает</h3>
    <p>Смотри на плитки. Если молчит одна, а остальные живы — проблема в сети
    этого туннеля, а не в программе. Если пропало всё сразу после того, как
    ноутбук поспал, помогает «Перезапустить»: во сне соединение рвётся, и
    открытые до этого страницы остаются висеть на мёртвых соединениях.</p>`;
  tick('howto');
}

// Пока стоит — render не затирает строку состояния своим текстом.
let NOTICE = null;

function notice(msg, color, ms) {
  const el = document.getElementById('state-sub');
  NOTICE = msg;
  el.textContent = msg;
  el.style.color = color;
  clearTimeout(notice.t);
  notice.t = setTimeout(() => { NOTICE = null; render(LAST); }, ms);
}

function failed(msg) {
  PENDING = null;                     // операция не пошла, кнопки отпускаем
  notice(msg, 'var(--bad)', 7000);
}

function renderVersion(v) {
  document.getElementById('version').textContent =
    `DualVPN ${v.app}` + (v.singbox ? ` · sing-box ${v.singbox}` : '');
}

// Лист поверх окна: заголовок, тело разметкой, кнопки [подпись, действие, класс].
function openSheet(title, html, buttons) {
  document.getElementById('sheet-name').textContent = title;
  const b = document.getElementById('sheet-body');
  b.classList.remove('mono');
  b.innerHTML = html;
  const f = document.getElementById('sheet-foot');
  f.innerHTML = buttons.map(([label, , cls], i) =>
    `<button data-i="${i}" class="${cls || ''}">${label}</button>`).join('');
  f.onclick = e => {
    const x = e.target.closest('[data-i]');
    if (x) buttons[+x.dataset.i][1]();
  };
  document.getElementById('sheet').classList.add('on');
}

function closeSheet() {
  RULES = null;
  document.getElementById('sheet').classList.remove('on');
}

function showInfo(title, paras) {
  // Абзацами, а не одним куском с переносами: иначе строки ломались там, где
  // я их набрал, и в конце абзаца оставалось по два слова.
  openSheet(title, paras.map(t => `<p>${esc(t)}</p>`).join(''),
            [['Закрыть', closeSheet, 'primary']]);
}

function showConf(tid, name, text) {
  openSheet(name + '.conf', '', [
    ['Удалить', () => {
      const t = (LAST.tunnels || []).find(x => x.id === tid);
      if (t) delConfig(t, name);
    }, 'danger'],
    ['Закрыть', closeSheet, 'primary']]);
  // Файл показывается целиком, включая ключи: он лежит на этой же машине,
  // и прятать его от владельца — только мешать копировать.
  const b = document.getElementById('sheet-body');
  b.classList.add('mono');
  b.textContent = text;
}

// Служба не решилась сама: файл похож на конфиг туннеля «по списку».
function askPlace(a) {
  const old = a.conf || a.name;
  openSheet(`Похоже на «${old}»`,
    `<p>«${esc(a.file)}» ведёт в те же сети, что и «${esc(old)}». Заменить его
     конфиг (правила туннелирования сохранятся) или добавить отдельным туннелем?</p>`,
    [['Заменить', () => { closeSheet(); send('place_config', {place: 'replace', tunnel: a.id}); }, 'primary'],
     ['Отдельный туннель', () => { closeSheet(); send('place_config', {place: 'new'}); }],
     ['Отмена', closeSheet]]);
}

// Лист «Туннелирование». У основного одно поле — его exclude: «пускать» ему
// не нужно, туда и так идёт всё, что не забрали другие.
const RULE_FIELDS = {
  include: ['Пускать через туннель',
            'домены, IP и подсети: a.ru, *.b.ru, 1.2.3.4, 10.0.0.0/8 — через пробел, запятую, «;» или с новой строки'],
  exclude: ['Не пускать',
            'не пойдёт в этот туннель, даже если попадает в «пускать» или в AllowedIPs его конфига'],
};
const ALL_FIELD = ['Мимо VPN (напрямую)', 'адреса и домены, которые идут напрямую, без туннеля'];
const ruleKeys = r => r.mode === 'all' ? ['exclude'] : ['include', 'exclude'];

function showRules(r) {
  const field = k => {
    const [label, hint] = r.mode === 'all' ? ALL_FIELD : RULE_FIELDS[k];
    return `<label class="field"><span class="flabel">${label}</span>
      <textarea id="f-${k}" spellcheck="false" autocapitalize="off">${esc(r[k].join('\n'))}</textarea>
      <span class="fhint">${hint}</span><span class="fnote" id="n-${k}"></span></label>`;
  };
  openSheet('Туннелирование · ' + tname(r), ruleKeys(r).map(field).join(''), [
    ['Загрузить из файла…', () => send('load_rules')],
    ['Сохранить в файл…', () => send('export_rules',
      {name: tname(RULES), include: RULES.include, exclude: RULES.exclude})],
    ['Сохранить', saveRules, 'primary'],
    ['Закрыть', closeSheet]]);
  RULES = r;
}

function saveRules() {
  const v = {tunnel: RULES.id};
  ruleKeys(RULES).forEach(k => { v[k] = document.getElementById('f-' + k).value; });
  send('save_rules', v);
}

// Ответ set-tunnel: поля — в том виде, как их понял routelist; непонятое —
// под полем, молча ничего не пропадает.
function rulesSaved(r) {
  if (!RULES) return;
  ruleKeys(RULES).forEach(k => {
    RULES[k] = r[k] || [];
    const f = document.getElementById('f-' + k), n = document.getElementById('n-' + k);
    if (!f || !n) return;
    f.value = RULES[k].join('\n');
    const bad = (r.rejected || {})[k] || [];
    n.textContent = `сохранено ${RULES[k].length}` + (bad.length ? ` · не понял: ${bad.join(', ')}` : '');
    n.classList.toggle('warn', bad.length > 0);
  });
}

// Отказ set-tunnel («a.ru уже в «Работа»», отменённый UAC): лист остаётся
// открытым с набранным, причина — под первым полем, а не под листом.
function rulesFailed(msg) {
  if (!RULES) return;
  const n = document.getElementById('n-' + ruleKeys(RULES)[0]);
  if (n) { n.textContent = msg; n.classList.add('warn'); }
}

// Из файла: JSON экспорта — по полям, просто текст — в первое поле.
function fillRules(v) {
  if (!RULES) return;
  const keys = ruleKeys(RULES);
  const put = (k, text) => { const f = document.getElementById('f-' + k); if (f) f.value = text; };
  if ('text' in v) put(keys[0], v.text);
  else keys.forEach(k => { if (k in v) put(k, v[k]); });
}

document.getElementById('btn-toggle').onclick = () => {
  const want = !LAST.up;
  PENDING = {want, at: Date.now()};
  send(want ? 'start' : 'stop');
  render(LAST);                       // мгновенная реакция, не ждём опроса
};
document.getElementById('btn-install').onclick = () => send('install_daemon');
document.getElementById('autostart').onchange = e => {
  AUTOSTART_PENDING = true;
  send('set_autostart', e.target.checked);
  render(LAST);
};
// Ответ на set_autostart — и при успехе, и при отказе: следующий render
// покажет то, что на самом деле записала служба.
function autostartDone() { AUTOSTART_PENDING = false; }
document.getElementById('verbose').onchange = e => {
  VERBOSE_PENDING = true;
  send('log_level', e.target.checked);
  render(LAST);
};
// Как у автозапуска: следующий render покажет записанный службой уровень.
function logLevelDone() { VERBOSE_PENDING = false; }
document.getElementById('btn-restart').onclick = () => {
  PENDING = {mode: 'restart', at: Date.now(), sawDown: false};
  send('restart');
  render(LAST);
};
document.getElementById('btn-add').onclick = () => send('add_config', {});

document.getElementById('pane-tunnels').addEventListener('click', e => {
  const mb = e.target.closest('[data-menu]');
  if (mb) { tileMenu(mb.dataset.menu, mb.dataset.name, mb); return; }
  const add = e.target.closest('[data-add-to]');
  if (add) { send('add_config', {tunnel: add.dataset.addTo}); return; }
  // Раньше выбора: ↻ лежит на плитке запасного, и клик выбрал бы его.
  const tb = e.target.closest('[data-test]');
  if (tb) { testStart(tb.dataset.test, tb.dataset.name); return; }
  // Посреди перезапуска выбор подождёт: команда ушла бы в середину цикла.
  const tile = e.target.closest('.tile.pick');
  if (tile && !busyNow(LAST) && !LAST.busy)
    send('use_config', {tunnel: tile.dataset.id, name: tile.dataset.name});
});

document.getElementById('search').oninput = () => renderLogs(logLines);
document.getElementById('only-err').onchange = () => renderLogs(logLines);
document.getElementById('btn-check').onclick = () => {
  checkStart();
  send('check');
};
// Ответ на check — и при успехе, и при сбое: кнопка не должна застрять.
function checkStart() {
  CHECKING = true;
  CHECK_LEFT = new Set((LAST.tunnels || []).map(t => t.id));
  render(LAST);
}
// Один туннель проверен, другие ещё ждут: перекрашиваем только проверенный.
function checkSides(s, left) {
  CHECK_LEFT = new Set(left.filter(k => CHECK_LEFT.has(k)));
  render(s);
}
function checkDone() { CHECKING = false; CHECK_LEFT = new Set(); render(LAST); }

// ↻ на плитке: проверка одного конфига, VPN не трогает. Ответ службы ждёт
// итога, сам итог страница берёт из статуса (tunnels[].tests).
function testStart(id, name) {
  const t = (LAST.tunnels || []).find(x => x.id === id);
  if (!t || testing(t, name)) return;
  TESTING.add(testKey(id, name));
  TESTED[testKey(id, name)] = t.seq;
  render(LAST);
  send('test_config', {tunnel: id, name});
}
// И при отказе службы: кнопка не должна застрять.
function testDone(a) { TESTING.delete(testKey(a.tunnel, a.name)); render(LAST); }

// Сообщаем Python, что страница поднялась: на этом держится сквозной тест —
// он проверяет всю цепочку от ресурса в бандле до моста обратно.
send('ready');

document.getElementById('tabs').onclick = e => {
  const t = e.target.closest('.tab');
  if (!t) return;
  closeMenu();
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  document.querySelectorAll('.pane').forEach(p => { p.hidden = p.id !== 'pane-' + t.dataset.tab; });
};

addEventListener('keydown', e => { if (e.key === 'Tab') document.body.classList.add('kbd'); });
addEventListener('mousedown', () => document.body.classList.remove('kbd'));
</script>
