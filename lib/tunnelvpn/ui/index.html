<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>TunnelVPN</title>
<script>
// Стили и скрипты — с той же меткой версии, что у страницы (window._page_url):
// pywebview отдаёт их с одним Last-Modified, и WebView2 по эвристике брал бы
// app.css и js/*.js прежней сборки из дискового кэша. document.write, а не
// createElement: так стили блокируют первую отрисовку, без кадра без стилей.
document.write(`<link rel="stylesheet" href="app.css${location.search}">`);
</script>

<body>
<svg id="sprite" aria-hidden="true">
  <!-- Статусы: форма различает их и без цвета. -->
  <symbol id="i-ok" viewBox="0 0 16 16"><circle cx="8" cy="8" r="4.6" fill="currentColor"/></symbol>
  <symbol id="i-err" viewBox="0 0 16 16"><path d="m4.6 4.6 6.8 6.8m0-6.8-6.8 6.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-warn" viewBox="0 0 16 16"><path fill="currentColor" fill-rule="evenodd" d="M8 1.6 15.2 14H.8ZM7.2 5.8v4.4h1.6V5.8Zm0 5.6v1.6h1.6v-1.6Z"/></symbol>
  <symbol id="i-off" viewBox="0 0 16 16"><circle cx="8" cy="8" r="4.8" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-unset" viewBox="0 0 16 16"><circle cx="8" cy="8" r="4.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2.513 2.513"/></symbol>
  <symbol id="i-busy" viewBox="0 0 16 16"><circle cx="8" cy="8" r="4.8" fill="none" stroke="currentColor" stroke-width="1.8" opacity=".28"/><path d="M8 3.2A4.8 4.8 0 0 1 12.8 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <!-- Действия: контур 1.6, цвет — от кнопки. -->
  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <symbol id="i-refresh" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.6v3h-3"/></symbol>
    <symbol id="i-restart" viewBox="0 0 16 16"><path d="M2.8 7a5.3 5.3 0 0 1 9.4-2.6M13.2 9a5.3 5.3 0 0 1-9.4 2.6M12.6 1.8v2.8H9.8M3.4 14.2v-2.8h2.8"/></symbol>
    <symbol id="i-power" viewBox="0 0 16 16"><path d="M8 1.8v5.6M4.4 4a5.2 5.2 0 1 0 7.2 0"/></symbol>
    <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
    <symbol id="i-split" viewBox="0 0 16 16"><path d="M2.5 5h9M9 2.5 11.5 5 9 7.5M13.5 11h-9M7 8.5 4.5 11 7 13.5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="8" height="8" rx="1.6"/><path d="M10.5 3.4V3.2c0-.8-.6-1.4-1.4-1.4H3.2c-.8 0-1.4.6-1.4 1.4v5.9c0 .8.6 1.4 1.4 1.4h.2"/></symbol>
    <symbol id="i-chev" viewBox="0 0 16 16"><path d="m6 3.8 4.2 4.2L6 12.2"/></symbol>
    <symbol id="i-close" viewBox="0 0 16 16"><path d="m4 4 8 8m0-8-8 8"/></symbol>
    <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.4"/><path d="m10.3 10.3 3.3 3.3"/></symbol>
    <symbol id="i-down" viewBox="0 0 16 16"><path d="M8 2.5v10m-4.2-4L8 12.7l4.2-4.2"/></symbol>
    <symbol id="i-file" viewBox="0 0 16 16"><path d="M4 1.8h5l3.2 3.2v9.2H4ZM9 1.8V5h3.2"/></symbol>
    <symbol id="i-folder" viewBox="0 0 16 16"><path d="M1.8 4.2c0-.8.6-1.4 1.4-1.4h3l1.5 1.6h5.1c.8 0 1.4.6 1.4 1.4v6.6c0 .8-.6 1.4-1.4 1.4H3.2c-.8 0-1.4-.6-1.4-1.4Z"/></symbol>
    <symbol id="i-info" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2"/><path d="M8 7.4v4M8 4.8v.1"/></symbol>
    <symbol id="i-eye" viewBox="0 0 16 16"><path d="M1.5 8S3.9 3.5 8 3.5 14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8Z"/><circle cx="8" cy="8" r="2"/></symbol>
    <symbol id="i-import" viewBox="0 0 16 16"><path d="M8 2v8M4.8 6.8 8 10l3.2-3.2M2.5 11.5v1.2c0 .7.6 1.3 1.3 1.3h8.4c.7 0 1.3-.6 1.3-1.3v-1.2"/></symbol>
    <symbol id="i-export" viewBox="0 0 16 16"><path d="M8 10V2M4.8 5.2 8 2l3.2 3.2M2.5 11.5v1.2c0 .7.6 1.3 1.3 1.3h8.4c.7 0 1.3-.6 1.3-1.3v-1.2"/></symbol>
    <symbol id="i-trash" viewBox="0 0 16 16"><path d="M2.8 4.2h10.4M6.2 4.2V2.8h3.6v1.4M4 4.2l.7 9.2c0 .5.5.9 1 .9h4.6c.5 0 1-.4 1-.9l.7-9.2"/></symbol>
    <symbol id="i-ext" viewBox="0 0 16 16"><path d="M9 2.5h4.5V7m0-4.5-6 6m4 1v3c0 .6-.4 1-1 1h-7c-.6 0-1-.4-1-1v-7c0-.6.4-1 1-1h3"/></symbol>
    <symbol id="i-edit" viewBox="0 0 16 16"><path d="M10.6 2.6a1.6 1.6 0 0 1 2.3 2.3l-7.7 7.7-3 .7.7-3Z"/></symbol>
    <symbol id="i-swap" viewBox="0 0 16 16"><path d="M4.5 13.5v-9M2 7l2.5-2.5L7 7M11.5 2.5v9M9 9l2.5 2.5L14 9"/></symbol>
  </g>
  <!-- Значок приложения: арка туннеля и три полосы разводки (тот же рисунок,
       что assets/icon.svg и icon.py). -->
  <symbol id="i-logo" viewBox="0 0 32 32"><path d="M7 26V15a9 9 0 0 1 18 0v11" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M16 14 10.5 26" stroke="var(--ok)" stroke-width="2.2" stroke-linecap="round"/><path d="M16 14 16 26" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"/><path d="M16 14 21.5 26" stroke="var(--busy)" stroke-width="2.2" stroke-linecap="round"/></symbol>
</svg>

<header id="bar">
  <nav id="tabs" role="tablist" aria-label="Разделы">
    <button class="tab" role="tab" data-tab="tunnels" aria-selected="true">Туннели</button>
    <button class="tab" role="tab" data-tab="log" aria-selected="false">Журнал</button>
    <button class="tab" role="tab" data-tab="settings" aria-selected="false">Настройки</button>
  </nav>
  <section id="top" class="st-busy" aria-live="polite"></section>
</header>

<main id="panes">
  <div id="pane-tunnels" class="pane" role="tabpanel"></div>
  <div id="pane-log" class="pane" role="tabpanel" hidden></div>
  <div id="pane-settings" class="pane" role="tabpanel" hidden></div>
</main>

<div id="layer-sheet"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="tip" role="tooltip" hidden></div>

<script>
// Скрипты по разделам — обычные, с общей областью видимости: Python зовёт
// функции страницы по имени (call/callN), им нужно быть на window. Мок моста —
// только в предпросмотре без pywebview (?mock=<сценарий>); в сборку ui/dev не
// попадает (installer/tunnelvpn.spec).
{
  const q = location.search;
  const mock = /[?&]mock=/.test(q) && !window.pywebview
    ? `<script src="dev/mock-api.js${q}"><\/script>` : '';
  // Порядок важен: core — первым, main (шлёт ready) — последним.
  const parts = ['core', 'main'];
  document.write(mock + parts.map(p => `<script src="js/${p}.js${q}"><\/script>`).join(''));
}
</script>
</body>
</html>
